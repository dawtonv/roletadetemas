// ── GLOBALS ──────────────────────────────────────────────────────────────────
const drawn = new Set();
let spinning = false;
let currentAngle = 0; // radians, cumulative rotation of the wheel

// ── CANVAS SETUP ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CW = canvas.width;  // 920
const CH = canvas.height; // 920
const CX = CW / 2;
const CY = CH / 2;
const R  = CX - 20;      // outer radius with small padding
const TOTAL = TEMAS.length; // 60
const SLICE = (2 * Math.PI) / TOTAL;

function drawWheel(rotation) {
  ctx.clearRect(0, 0, CW, CH);

  // outer ring shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 24;
  ctx.beginPath();
  ctx.arc(CX, CY, R + 4, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();

  for (let i = 0; i < TOTAL; i++) {
    const tema = TEMAS[i];
    const startAngle = rotation + i * SLICE;
    const endAngle   = startAngle + SLICE;
    const cor = EIXOS[tema.eixo].cor;

    // slice fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = drawn.has(tema.id)
      ? lightenHex(cor, 0.55)   // drawn themes are lighter
      : cor;
    ctx.fill();

    // separator line
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, startAngle, startAngle);
    ctx.lineTo(
      CX + R * Math.cos(startAngle),
      CY + R * Math.sin(startAngle)
    );
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // number label — just the id, small, near center
    const midAngle = startAngle + SLICE / 2;
    const labelR = R * 0.78;
    const tx = CX + labelR * Math.cos(midAngle);
    const ty = CY + labelR * Math.sin(midAngle);
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(midAngle + Math.PI / 2);
    ctx.font = 'bold 9px Lato, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 2;
    ctx.fillText(tema.id, 0, 0);
    ctx.restore();
  }

  // center circle
  const CR = 72;
  ctx.beginPath();
  ctx.arc(CX, CY, CR, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.strokeStyle = '#004577';
  ctx.lineWidth = 4;
  ctx.stroke();
  // inner accent ring
  ctx.beginPath();
  ctx.arc(CX, CY, CR - 8, 0, 2 * Math.PI);
  ctx.strokeStyle = '#F36F1B';
  ctx.lineWidth = 2;
  ctx.stroke();

  // center text
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.font = 'bold 18px Merriweather, serif';
  ctx.fillStyle = '#004577';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('ENEM', CX, CY - 12);
  ctx.font = 'bold 15px Lato, sans-serif';
  ctx.fillStyle = '#F36F1B';
  ctx.fillText('2026', CX, CY + 10);
  ctx.font = '9px Lato, sans-serif';
  ctx.fillStyle = '#3A5570';
  ctx.fillText('roleta', CX, CY + 26);
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function abbreviate(text, maxLen) {
  // strip common prefixes to save space
  const t = text
    .replace(/^Desafios para (garantir |a |o |combater |enfrentar )?/i, '')
    .replace(/^Os desafios (da |do |de |para )?/i, '')
    .replace(/^Os impactos (da |do |de )?/i, '')
    .replace(/^A importância (da |do |de )?/i, '')
    .replace(/ no Brasil$/i, '')
    .replace(/ nas? (escolas?|universidades?|periferias?).*$/i, '');
  return t.length > maxLen ? t.slice(0, maxLen - 1) + '…' : t;
}

function lightenHex(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.min(255, Math.floor(((num >> 16) & 0xff) + (255 - ((num >> 16) & 0xff)) * amount));
  const g = Math.min(255, Math.floor(((num >> 8) & 0xff)  + (255 - ((num >> 8) & 0xff))  * amount));
  const b = Math.min(255, Math.floor((num & 0xff)          + (255 - (num & 0xff))          * amount));
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function renderStars(estrelas) {
  // estrelas can be 1, 1.5, 2, 3, 4, 5
  let html = '';
  const full  = Math.floor(estrelas);
  const half  = (estrelas % 1) >= 0.5;
  const empty = 5 - full - (half ? 1 : 0);
  for (let i = 0; i < full; i++) html += '★';
  if (half) html += '½';
  for (let i = 0; i < empty; i++) html += '☆';
  return html;
}

// ── LEGEND ───────────────────────────────────────────────────────────────────
function renderLegend() {
  const leg = document.getElementById('legend');
  leg.innerHTML = Object.entries(EIXOS).map(([k, v]) =>
    `<div class="legend-item">
      <div class="legend-dot" style="background:${v.cor}"></div>
      <span>${v.nome}</span>
    </div>`
  ).join('');
}

// ── SPIN ─────────────────────────────────────────────────────────────────────
function spin() {
  if (spinning) return;
  const available = TEMAS.filter(t => !drawn.has(t.id));
  if (available.length === 0) {
    alert('Todos os 60 temas já foram sorteados! Clique em Reiniciar para recomeçar.');
    return;
  }

  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  // Pick a random target tema from available
  const target = available[Math.floor(Math.random() * available.length)];
  const targetIndex = TEMAS.findIndex(t => t.id === target.id);

  // The pointer is at top (−π/2). We want slice `targetIndex` to land there.
  // Center of slice i in wheel coords: i * SLICE + SLICE/2
  // We need: rotation + i*SLICE + SLICE/2 ≡ -π/2  (mod 2π)
  // So: rotation = -π/2 - i*SLICE - SLICE/2
  // Add several full turns for a nice spin effect
  const baseAngle = -Math.PI / 2 - targetIndex * SLICE - SLICE / 2;
  const extraTurns = (4 + Math.floor(Math.random() * 4)) * 2 * Math.PI;
  const finalAngle = baseAngle - extraTurns;

  // Normalize finalAngle so we always spin forward (counter to current)
  const startAngle = currentAngle;
  const totalRot   = finalAngle - startAngle - ((finalAngle - startAngle) % (2 * Math.PI)) + finalAngle + extraTurns;

  const duration = 4000 + Math.random() * 1500; // 4–5.5 s
  const start = performance.now();

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4); // quartic ease-out
  }

  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const eased = easeOut(t);

    currentAngle = startAngle + (finalAngle - startAngle) * eased;
    drawWheel(currentAngle);

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      currentAngle = finalAngle;
      drawWheel(currentAngle);
      spinning = false;
      drawn.add(target.id);
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('drawnCount').textContent = drawn.size;
      openModal(target);
    }
  }

  requestAnimationFrame(animate);
}

function resetDrawn() {
  drawn.clear();
  document.getElementById('drawnCount').textContent = 0;
  drawWheel(currentAngle);
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(tema) {
  const eixo  = EIXOS[tema.eixo];
  const prob  = PROB[tema.prob];
  const esq   = tema.esquema;

  // header
  document.getElementById('modalHeader').style.background = eixo.cor;
  document.getElementById('modalEixo').textContent = 'Eixo ' + tema.eixo + ' • ' + eixo.nome;
  document.getElementById('modalTitle').textContent = tema.titulo;

  // prob
  document.getElementById('modalStars').innerHTML = renderStars(prob.estrelas);
  document.getElementById('modalProbTag').textContent = prob.label;

  // evidencias
  document.getElementById('modalEvidencias').textContent = tema.evidencias;

  // esquema
  const esquemaEl = document.getElementById('modalEsquema');
  esquemaEl.innerHTML = `
    ${buildEsquemaBlock('Repertórios de Introdução', esq.rep_intro, 'default')}
    ${buildEsquemaBlock('1º Argumento', [{ _text: esq.arg1 }], 'alt')}
    ${buildEsquemaBlock('Repertórios do 1º Argumento', esq.rep1, 'default')}
    ${buildEsquemaBlock('2º Argumento', [{ _text: esq.arg2 }], 'alt')}
    ${buildEsquemaBlock('Repertórios do 2º Argumento', esq.rep2, 'default')}
    ${buildIntervencao(esq.intervencao)}
  `;

  // attach chip toggle handlers after inserting into DOM
  esquemaEl.querySelectorAll('.rep-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const dica = chip.nextElementSibling;
      chip.classList.toggle('open');
      if (dica) dica.classList.toggle('open');
    });
  });

  // fontes
  const fontesEl = document.getElementById('modalFontes');
  fontesEl.innerHTML = tema.fontes.map(f => `<span>${f}</span>`).join(' ');

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function buildEsquemaBlock(label, items, variant) {
  const headerClass = variant === 'alt' ? 'esquema-block-header alt' : 'esquema-block-header';

  let bodyHtml = '';
  if (items[0] && items[0]._text) {
    // plain text (arg1, arg2)
    bodyHtml = `<div class="esquema-block-body">${items[0]._text}</div>`;
  } else {
    // rep chips
    const chips = items.map(rep => {
      const tipo  = rep.tipo || '';
      const texto = rep.texto || '';
      const dica  = rep.dica || rep.dica_base || '';
      return `
        <div class="rep-chip">
          <span class="rep-chip-type">${tipo}</span>
          <span class="rep-chip-text">${texto}</span>
          <span class="rep-chip-arrow">▶</span>
        </div>
        <div class="rep-dica">${dica}</div>
      `;
    }).join('');
    bodyHtml = `<div class="esquema-block-body rep-list">${chips}</div>`;
  }

  return `
    <div class="esquema-block">
      <div class="${headerClass}">${label}</div>
      ${bodyHtml}
    </div>
  `;
}

function buildIntervencao(inv) {
  return `
    <div class="esquema-block">
      <div class="esquema-block-header green">Proposta de Intervenção</div>
      <div class="esquema-block-body">
        <div class="interv-grid">
          <div class="interv-key">Agente</div><div class="interv-val">${inv.agente}</div>
          <div class="interv-key">Detalhamento</div><div class="interv-val">${inv.detalhamento}</div>
          <div class="interv-key">Ação</div><div class="interv-val">${inv.acao}</div>
          <div class="interv-key">Modo</div><div class="interv-val">${inv.modo}</div>
          <div class="interv-key">Efeito</div><div class="interv-val">${inv.efeito}</div>
        </div>
      </div>
    </div>
  `;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ── CANVAS HIT-TEST ─────────────────────────────────────────────────────────
function getTemaAt(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  const x = (clientX - rect.left) * scaleX - CX;
  const y = (clientY - rect.top)  * scaleY - CY;
  const dist = Math.sqrt(x * x + y * y);
  const CR = 72; // center circle radius (must match drawWheel)
  if (dist < CR || dist > R) return null; // center or outside
  // angle relative to current rotation, normalised to [0, 2π)
  let angle = Math.atan2(y, x) - currentAngle;
  angle = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const idx = Math.floor(angle / SLICE) % TOTAL;
  return TEMAS[idx] || null;
}

// ── TOOLTIP ──────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('wheelTooltip');

canvas.addEventListener('mousemove', (e) => {
  if (spinning) { tooltip.style.display = 'none'; return; }
  const tema = getTemaAt(e.clientX, e.clientY);
  if (!tema) { tooltip.style.display = 'none'; canvas.style.cursor = 'crosshair'; return; }
  const prob = PROB[tema.prob];
  document.getElementById('ttNum').textContent = 'Tema ' + tema.id + ' · ' + EIXOS[tema.eixo].nome;
  document.getElementById('ttTitle').textContent = tema.titulo;
  document.getElementById('ttStars').innerHTML = renderStars(prob.estrelas);
  document.getElementById('ttProbLabel').textContent = prob.label;
  document.getElementById('ttDrawn').textContent = drawn.has(tema.id) ? '✓ já sorteado — clique para rever' : 'Clique para abrir';
  // position tooltip
  const gap = 12;
  let left = e.clientX + gap;
  let top  = e.clientY + gap;
  tooltip.style.display = 'block';
  const tw = tooltip.offsetWidth;
  const th = tooltip.offsetHeight;
  if (left + tw > window.innerWidth  - 8) left = e.clientX - tw - gap;
  if (top  + th > window.innerHeight - 8) top  = e.clientY - th - gap;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = top  + 'px';
  canvas.style.cursor = 'pointer';
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

canvas.addEventListener('click', (e) => {
  if (spinning) return;
  const tema = getTemaAt(e.clientX, e.clientY);
  if (!tema) return;
  tooltip.style.display = 'none';
  drawn.add(tema.id);
  document.getElementById('drawnCount').textContent = drawn.size;
  drawWheel(currentAngle);
  openModal(tema);
});

// ── INIT ─────────────────────────────────────────────────────────────────────
renderLegend();
drawWheel(currentAngle);
</script>
