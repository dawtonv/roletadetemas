{id:1,titulo:"Desafios para garantir a segurança de crianças e adolescentes no ambiente digital no Brasil",eixo:5,prob:"ALTISSIMA",fontes:["Afranio Pedroso","Bella Nazar","Aprova Total","Slides Eixo 5"],evidencias:"O Brasil é o 4º país com mais horas de uso de redes sociais (DataReportal, 2024). O ECA Digital (Lei 14.811/2024) é resposta recente do legislativo. UNICEF aponta que 1 em cada 3 usuários de internet no mundo é criança.",esquema:{rep_intro:[{...REP.eca_digital,dica:"A lei recente mostra que o Estado reagiu ao problema; use-a como ponto de partida para mostrar que a legislação existe, mas a implementação e a conscientização ainda são desafios."},{ ...REP.onu_crianca,dica:"A Convenção da ONU estabelece o princípio do melhor interesse da criança; use para mostrar que a proteção digital é obrigação internacional assumida pelo Brasil."}],arg1:"A exposição precoce e desregulada de crianças a conteúdos violentos, sexuais e de ódio nas plataformas digitais compromete o desenvolvimento psicológico e social, em um contexto em que os algoritmos priorizam o engajamento sobre a proteção.",rep1:[{...REP.byung_chul,dica:"Han mostra que a sociedade digital cria dinâmicas de desempenho e de comparação que adoecem adultos; aplique a crianças para mostrar o impacto ainda mais grave sobre mentes em formação."},{...REP.lgpd,dica:"A LGPD protege dados de adultos, mas a proteção de dados de crianças é insuficiente; use como lacuna legal que o ECA Digital começa a preencher."}],arg2:"A falta de educação digital nas escolas e de orientação familiar deixa crianças sem ferramentas para lidar com riscos como grooming, cyberbullying e desinformação.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a leitura crítica do mundo; a educação digital é a aplicação desse princípio na era das redes: aprender a ler criticamente o ambiente digital."},{...REP.onu_crianca,dica:"A Convenção garante à criança proteção contra todas as formas de violência; o ambiente digital é o espaço mais novo e menos protegido."}],intervencao:{agente:"O Estado brasileiro",detalhamento:"responsável pela regulação do ambiente digital e pela garantia dos direitos fundamentais de crianças e adolescentes",acao:"deve regulamentar a responsabilização das big techs pelo conteúdo ofertado a menores, criar programa nacional de letramento digital para pais e alunos e implementar o ECA Digital com metas mensuráveis",modo:"por meio de multas dissuasivas às plataformas que descumprirem a legislação, capacitação de professores e campanhas de conscientização familiar",efeito:"garantindo que o ambiente digital seja um espaço seguro para o desenvolvimento integral de crianças e adolescentes"}}},
{id:2,titulo:"Desafios para combater a evasão escolar no Brasil",eixo:2,prob:"ALTISSIMA",fontes:["Profinho","Slides Eixo 2","SAE simulados"],evidencias:"Mais de 600 mil jovens abandonaram a escola em 2023 (MEC). O PNE 2026 estabelece meta de universalização do ensino médio. Desigualdade socioeconômica é o principal fator de evasão.",esquema:{rep_intro:[{...REP.pe_de_meia,dica:"O Programa Pé-de-Meia é uma resposta direta do Estado à evasão; cite-o para mostrar que há reconhecimento do problema, mas que incentivos financeiros não são suficientes isoladamente."},{...REP.pne_2026,dica:"O PNE torna a universalização do ensino médio uma meta legal; mostre a distância entre o compromisso formal e a realidade da evasão."}],arg1:"A necessidade de trabalhar precocemente, derivada da pobreza estrutural, é o principal vetor da evasão escolar, colocando a educação em posição de desvantagem em relação à sobrevivência imediata.",rep1:[{...REP.ibge_desigualdade,dica:"Dados da PNAD mostram a concentração da evasão entre jovens negros e de baixa renda; dão concretude ao argumento da desigualdade estrutural."},{texto:"IBGE/PNAD Contínua 2023 — desigualdade de acesso à educação por renda e cor/raça",tipo:"Dado/Pesquisa",dica:"Piketty mostra que desigualdade de renda reproduz desigualdade de educação; a evasão é um elo dessa cadeia que perpetua a pobreza inter-geracional."}],arg2:"A escola que não dialoga com a realidade do aluno — especialmente nas periferias — contribui para o desengajamento e o abandono, tornando a evasão também um problema pedagógico.",rep2:[{...REP.freire_pedagogia,dica:"Freire critica a educação bancária que deposita conteúdo sem dialogar com a realidade; a escola desconectada da vida do aluno pobre afasta em vez de reter."},{...REP.senado_evasao,dica:"O relatório do Senado lista causas multifatoriais da evasão; use para mostrar que a solução exige abordagem integrada, não apenas transferência de renda."}],intervencao:{agente:"O Governo Federal",detalhamento:"detentor da competência constitucional de coordenar a política nacional de educação e distribuir recursos para garantir a universalização do ensino médio",acao:"deve ampliar o Programa Pé-de-Meia, criar sistema de monitoramento da frequência com alertas precoces e fortalecer a escola de tempo integral nas periferias",modo:"por meio de repasse condicionado de recursos federais ao desempenho na manutenção de matrículas, formação de professores para atender alunos em vulnerabilidade e ampliação de polos de ensino médio técnico",efeito:"garantindo que jovens de baixa renda concluam a educação básica e tenham acesso a melhores oportunidades de trabalho e cidadania"}}},
{id:3,titulo:"Os desafios da regulação das apostas online no Brasil",eixo:7,prob:"ALTISSIMA",fontes:["Elias Ancelmo","Aprova Total","Profinho"],evidencias:"O Brasil legalizou as bets em 2023 e já é o 2º mercado mundial de apostas online. Pesquisa do BC (2024) mostrou que beneficiários do Bolsa Família gastavam em média R$147/mês em bets. Crescimento de casos de ludomania e endividamento.",esquema:{rep_intro:[{...REP.bets_portaria,dica:"A portaria do MF é a tentativa de regulação do mercado; use-a para mostrar que o Estado reconheceu o problema, mas a regulamentação chegou depois que o mercado já estava instalado."},{texto:"Secap/MF — Nota Técnica sobre Perfil do Apostador e Endividamento por Bets (2024)",tipo:"Dado/Pesquisa",dica:"Bauman mostra que na modernidade líquida as certezas se diluem e os atalhos para o sucesso se multiplicam; as apostas são a versão digital da promessa do enriquecimento rápido em tempos de incerteza."}],arg1:"A população de baixa renda é o público mais vulnerabilizado pelas apostas online, pois combina vulnerabilidade econômica com acesso facilitado por celular e pressão de marketing agressivo voltado para esse segmento.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre renda e hábitos de consumo das faixas mais pobres evidenciam como as bets drenam recursos de famílias já fragilizadas."},{texto:"Banco Central do Brasil — Relatório sobre fluxo de transferências a plataformas de apostas (2024)",tipo:"Dado/Pesquisa",dica:"Piketty mostra como o capitalismo concentra riqueza; as bets são um mecanismo de transferência de renda da população pobre para grandes corporações internacionais."}],arg2:"A ausência de limites de apostas, de mecanismos de auto-exclusão eficazes e de tratamento para o viciado em jogo tórna o sistema de apostas um problema de saúde pública.",rep2:[{...REP.onu_saude_mental,dica:"A OMS reconhece o transtorno do jogo como condição de saúde; use para dar legitimidade científica à demanda por políticas de prevenção e tratamento."},{...REP.sus_saude_mental,dica:"O SUS tem obrigação de tratar dependências; o aumento da ludomania por bets é uma nova demanda que o sistema não está preparado para absorver."}],intervencao:{agente:"O Estado brasileiro",detalhamento:"responsável pela regulação econômica, pela saúde pública e pela fiscalização das comunicações no país",acao:"deve regulamentar rigorosamente as apostas online, impondo limites de depósito, proibindo publicidade direcionada a vulneráveis e criando programa nacional de prevenção e tratamento da ludomania",modo:"por meio de legislação específica, fiscalização das plataformas e destinação de parte da arrecadação fiscal das bets para o SUS",efeito:"protegendo a população, especialmente a mais vulnerabilizada, dos danos econômicos e de saúde gerados pelo jogo compulsivo"}}},
{id:4,titulo:"Desafios para a construção de um mercado de trabalho mais justo no Brasil",eixo:8,prob:"ALTISSIMA",fontes:["Elias Ancelmo","Slides Eixo 8"],evidencias:"O movimento contra a jornada 6x1 ganhou força no Congresso em 2024–2025. O Brasil tem a 3ª maior jornada de trabalho do mundo (ILO, 2024). A PEC 23 da jornada tramita no Congresso desde 2024.",esquema:{rep_intro:[{texto:"OIT — Relatório Mundial sobre Emprego e Questões Sociais 2023",tipo:"Dado/Pesquisa",dica:"Toffler previu que a Terceira Onda traria novas formas de trabalho; use para contextualizar que a discussão da jornada 6x1 é parte de uma transformação estrutural que exige nova legislação."},{...REP.byung_chul,dica:"Han mostra que a sociedade de desempenho cria auto-exploração; aplique ao trabalhador que aceita a jornada excessiva como norma, sem perceber o custo para sua saúde."}],arg1:"A jornada 6x1 concentrada em trabalhadores de baixa renda — comércio, serviços, logística — priva essa população de tempo para lazer, família e qualificação, perpetuando a desigualdade social.",rep1:[{...REP.ibge_desigualdade,dica:"A PNAD mostra que a jornada excessiva concentra-se nos decis trabalhadores mais pobres e negros; dá base empírica à dimensão social do argumento."},{texto:"Chico Buarque — Construção (1971)",tipo:"Cultural/Música",dica:"Construção narra em repetições hipnóticas o cotidiano do operário anônimo: a precariedade, a invisibilidade e o descarte; a letra é um manifesto poético sobre as condições de trabalho que o Brasil ainda não superou."}],arg2:"A reestruturação da jornada de trabalho pode ampliar a produtividade e a qualidade de vida sem comprometer a competição econômica, como demonstram as experiências internacionais com a semana de 4 dias.",rep2:[{...REP.senai_trabalho,dica:"Dados do SENAI sobre impacto da redução de jornada na produtividade; use para mostrar que a proposta não é antieconomíca, mas pode aumentar eficiência."},{texto:"FGV Social — \"Futuro do Trabalho no Brasil\" (2024): automação e impacto sobre postos",tipo:"Dado/Pesquisa",dica:"Harari discute o futuro do trabalho na era da automação; a redução da jornada é uma das respostas possíveis ao excedente de mão de obra que a IA vai gerar."}],intervencao:{agente:"O Congresso Nacional",detalhamento:"detentor da competência legislativa exclusiva para reformar a Consolidação das Leis do Trabalho e fixar limites de jornada",acao:"deve aprovar a reforma da jornada de trabalho, estabelecendo limites máximos semanais mais justos e garantindo adicional de remunerase para horas extras",modo:"por meio de negociação tripartite, implementação gradual e estudo de impacto por setor econômico",efeito:"promovendo o bem-estar dos trabalhadores e aumentando a produtividade, a criatividade e a cooesão familiar"}}},
{id:5,titulo:"Os impactos da hiperconectividade na saúde mental dos jovens brasileiros",eixo:7,prob:"ALTISSIMA",fontes:["Afranio Pedroso","acelerenoenem","Slides Eixo 7"],evidencias:"O Brasil é um dos países com maior tempo de uso de redes sociais (DataReportal, 2024). A OMS declarou a saúde mental de adolescentes uma crise global. Casos de ansiedade em jovens subiram 40% pós-pandemia (Fiocruz, 2023).",esquema:{rep_intro:[{...REP.byung_chul,dica:"Han é o teórico central aqui: a sociedade do cansamento explica por que a superconexão esgota em vez de conectar. Use seu conceito de ‘infarto da alma’ para introduzir o paradoxo da hiperconectividade."},{...REP.onu_saude_mental,dica:"O relatório da OMS (2022) sobre crise de saúde mental em adolescentes dá dimensão global ao problema; mostra que o Brasil não é exceção."}],arg1:"Os algoritmos das redes sociais, projetados para maximizar o tempo de tela, estimulam a comparação social constante, a busca por validação e a ansiedade de desempenho, comprometendo a saúde mental de adolescentes.",rep1:[{texto:"Instituto DataSenado — \"Violência Doméstica e Familiar contra a Mulher\" (2023)",tipo:"Dado/Pesquisa",dica:"Bauman mostra que as identidades se tornam instáveis na modernidade líquida; as redes amplificam essa instabilidade ao tornar a identidade dependente de curtidas e seguidores."},{...REP.lei_celular,dica:"A lei de proibição de celular nas escolas (2025) é uma resposta do Estado ao problema; use para mostrar que há reconhecimento do risco, mas a medida é pontual e insuficiente."}],arg2:"A ausência de educação para o uso crítico das redes e de suporte de saúde mental nas escolas deixa os jovens sem ferramentas para gerenciar os efeitos da hiperconectividade.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a leitura crítica do mundo; aplique ao uso das redes para mostrar que educar para a autonomia digital é condição de emancipação no século XXI."},{...REP.sus_saude_mental,dica:"A Reforma Psiquíiátrica (Lei 10.216) reafirmou a saúde mental como direito; use para cobrar do SUS a atenção à nova demanda dos adolescentes adoecidos pelas redes."}],intervencao:{agente:"O Ministério da Saúde e o Ministério da Educação",detalhamento:"órgãos federais responsáveis, respectivamente, pela política nacional de saúde mental e pela formação integral dos estudantes",acao:"devem criar programa nacional de saúde mental escolar, incluir educação digital crítica no currículo e regulamentar o design aditivo dos algoritmos voltados a menores",modo:"por meio de psicólogos nas escolas públicas, formação de professores para identificação precoce de transtornos e legislação que imponha limites de tempo de tela para usuários menores de 16 anos",efeito:"garantindo que os jovens brasileiros possam usufruir das tecnologias digitais sem comprometer sua saúde mental e seu desenvolvimento integral"}}},
{id:6,titulo:"Desafios para a garantia da saúde mental como direito no SUS",eixo:7,prob:"ALTA",fontes:["Slides Eixo 7","Profinho"],evidencias:"O Brasil tem apenas 3,2 psiquiatras por 100 mil habitantes (CFM, 2023). Apenas 1/3 dos municípios têm CAPS implantado. A Lei 10.216/2001 completou 20 anos com meta de desinstitucionalização ainda não cumprida.",esquema:{rep_intro:[{...REP.sus_saude_mental,dica:"A Lei 10.216 é o marco jurídico da reforma psiquíiátrica; use-a para mostrar que o Brasil tem legislação avançada, mas a implementação é o desafio central."},{...REP.onu_saude_mental,dica:"O relatório da OMS (2022) reforça que saúde mental é um direito; use para dar base internacional ao argumento e mostrar que o Brasil está abaixo das metas globais."}],arg1:"A escassez de CAPS, equipes de saúde mental na Atenção Básica e profissionais especializados no SUS cria uma lacuna assistencial que recai desproporcionalmente sobre a população mais pobre.",rep1:[{...REP.ibge_desigualdade,dica:"A PNAD mostra que o acesso a serviços de saúde mental é fortemente estratificado por renda; os mais pobres são os mais adoecidos e os menos atendidos."},{texto:"CONASS — Relatório \"Saúde Brasil 2023\": iniquidades no acesso ao SUS por renda e raça",tipo:"Dado/Pesquisa",dica:"A desigualdade de acesso a saúde é um mecanismo de reprodução da desigualdade de capital humano; quem adoece sem tratamento perde renda, produtividade e dignidade."}],arg2:"O estigma social associado aos transtornos mentais ainda constitui uma barreira que desestimula a busca por tratamento e perpetua o sofrimento em silêncio.",rep2:[{...REP.byung_chul,dica:"Han mostra que a sociedade do desempenho criminaliza o fracasso; o adoecimento mental é visto como fraqueza individual, dificultando a busca por ajuda."},{...REP.freire_pedagogia,dica:"Freire defende a conscientização como caminho para a emancipação; educar sobre saúde mental é condicião para que as pessoas reconheçam seus direitos e os reivindiquem."}],intervencao:{agente:"O Ministério da Saúde",detalhamento:"responsável pela coordenação da Rede de Atenção Psicossocial e pelo financiamento federal dos CAPS e das equipes de saúde mental",acao:"deve ampliar a rede de CAPS, inserir profissionais de saúde mental nas equipes de Atenção Básica e criar campanha nacional de combate ao estigma",modo:"por meio de financiamento federal condicionado à implantação de CAPS nos municípios de médio porte, concursos públicos para psicólogos e psiquiatras do SUS e programa de educação em saúde mental nas escolas",efeito:"garantindo que todo brasileiro, independentemente da renda, tenha acesso a tratamento de saúde mental digno e eficaz"}}},
{id:7,titulo:"Desafios para o enfrentamento do feminicídio no Brasil",eixo:1,prob:"ALTA",fontes:["Abimael Ferreira","Slides Eixo 1"],evidencias:"O Brasil é o 5º país com mais feminicídios no mundo (IPEA, 2023). A Lei do Feminicídio (2015) criou o tipo penal, mas casos cresceram. Em 2023, uma mulher foi morta a cada 6 horas no Brasil.",esquema:{rep_intro:[{...REP.feminicidio_lei,dica:"A lei é o marco jurídico central; use para mostrar que o Estado reconheceu o feminicídio como crime de ódio, mas a punição não é suficiente para prevenir sem políticas complementares."},{...REP.mbembe_necro,dica:"A necropolítica explica por que certos corpos são mais sujeitos à morte; o feminicídio é a expressão extrema de uma sociedade que decide, estruturalmente, que a vida das mulheres vale menos."}],arg1:"A cultura do machísmo e da dominação masculina, reproduzida em instituições, mídia e família, cria o caldo de cultura em que a violência de gênero se naturaliza e o feminicídio ocorre como último ato de controle.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra como a opressião coloniza o corpo; aplique ao controle patriarcal sobre o corpo da mulher como uma forma de colonização de gênero que se impõe pela violência."},{...REP.ibge_desigualdade,dica:"Dados sobre violência doméstica e feminicídio mostram concentração em mulheres negras e de baixa renda; evidencia a interseccionalidade do problema."}],arg2:"A subnotificação da violência doméstica, o despreparo das instituições e a falta de casas-abrigo suficientes deixam as mulheres sem proteção efetiva antes que o feminicídio ocorra.",rep2:[{texto:"ONU Mulheres — \"Progresso das Mulheres no Mundo 2023\": segurança pública e participação democrática",tipo:"Dado/Pesquisa",dica:"Democracia exige igualdade real; uma sociedade em que mulheres não têm segurança de ir e vir não é democrática em sentido pleno."},{...REP.onu_saude_mental,dica:"A OMS reconhece a violência de gênero como determinante social de saúde; use para ampliar a discussão além do campo penal, incluindo os impactos na saúde física e mental das vítimas."}],intervencao:{agente:"O Estado brasileiro",detalhamento:"detentor do monopólio legítimo da força e da obrigação constitucional de proteger a vida e a integridade física de todas as cidadãs",acao:"deve ampliar a rede de casas-abrigo, criar juizados especializados em violência doméstica em todos os municípios e incluir educação para equidade de gênero no currículo escolar",modo:"por meio de financiamento federal, capacitação de profissionais de segurança e saúde para identificar e notificar casos e campanhas de conscientização",efeito:"protegendo as mulheres brasileiras e construindo uma cultura de respeito e igualdade que previna a violência de gênero em sua raiz"}}},
{id:8,titulo:"Os desafios da inteligência artificial para o mercado de trabalho no Brasil",eixo:8,prob:"ALTA",fontes:["Slides Eixo 8","Aprova Total"],evidencias:"O McKinsey Global Institute (2023) estima que 30% das tarefas do trabalho atual serão automatizadas até 2030. No Brasil, setores como bancos, logística e varejo já eliminaram postos. O PNE 2026 inclui letramento digital como meta.",esquema:{rep_intro:[{texto:"Fórum Econômico Mundial — \"Future of Jobs 2023\": 85 milhões de empregos ameaçados",tipo:"Dado/Pesquisa",dica:"Harari analisa o impacto da IA sobre o futuro do trabalho; use para contextualizar que a transformação é estrutural, não conjuntural, e exige resposta política de longo prazo."},{texto:"MIT Technology Review — \"The State of AI\" (2024): impacto da IA no mercado de trabalho",tipo:"Dado/Pesquisa",dica:"Toffler previu a revolução das informações; a IA é o estágio mais avançado dessa onda que vai redesenhar as relações de trabalho."}],arg1:"A automação por IA tende a eliminar primeiro os postos de trabalho de rotina e baixa qualificação, atingindo desproporcionalmente trabalhadores negros, de baixa renda e com menos acesso à formação digital.",rep1:[{texto:"McKinsey Global Institute — \"The Economic Potential of Generative AI\" (2023)",tipo:"Dado/Pesquisa",dica:"Piketty mostra que o capital tende a se concentrar; a IA aumenta o retorno do capital em detrimento do trabalho, aprofundando a desigualdade se não houver regulação."},{...REP.ibge_desigualdade,dica:"Dados sobre qualificação e emprego mostram que trabalhadores negros e sem ensino médio completo são os mais expostos à substituição tecnológica."}],arg2:"O Brasil não tem política pública de requalificação profissional em escala suficiente para preparar a força de trabalho para a era da IA, deixando milhões de trabalhadores às margens da transição.",rep2:[{...REP.senai_trabalho,dica:"O SENAI aponta quais competências serão demandadas na era digital; use para mostrar que existe clareza sobre o que é preciso aprender, mas falta escala nas políticas de qualificação."},{...REP.freire_pedagogia,dica:"Freire defende a educação como instrumento de emancipação; a formação para o mundo digital é a versão atual desse imperativo."}],intervencao:{agente:"O Governo Federal",detalhamento:"detentor dos recursos do Fundo de Amparo ao Trabalhador e da competência para criar políticas públicas de qualificação profissional em escala nacional",acao:"deve criar programa nacional de requalificação digital para trabalhadores em risco de automação, regular a responsabilidade das empresas que automatizam e criar fundo de transição tecnológica",modo:"por meio de recursos do FAT, parcerias com o setor privado e cursos gratuitos de letramento e certificação digital em rede presencial e on-line",efeito:"garantindo que a transição tecnológica seja justa e que nenhum trabalhador seja deixado para trás pela automação"}}},
{id:9,titulo:"Os desafios do Brasil diante das mudanças climáticas",eixo:6,prob:"ALTA",fontes:["Elias Ancelmo","Profinho","Slides Eixo 6"],evidencias:"O Brasil é um dos países mais vulneráveis às mudanças climáticas (IPCC, 2023). As enchentes do RS em 2024 mataram mais de 150 pessoas. O desmatamento da Amazônia caiu 50% em 2023, mas ainda preocupa.",esquema:{rep_intro:[{...REP.ipcc_clima,dica:"O IPCC é a autoridade científica máxima sobre clima; use para dar base científica irrefutável ao problema e mostrar que o Brasil está entre os países mais atingidos."},{...REP.paris_clima,dica:"O Acordo de Paris compromete o Brasil a metas de redução de emissões; use para mostrar que há obrigação internacional assumida, mas a implementação é insuficiente."}],arg1:"Os eventos climáticos extremos — enchentes, secas, ondas de calor — afetam desproporcionalmente as populações mais pobres, que habitam áreas de risco e têm menos recursos para se recuperar.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre distribuição geográfica da pobreza e áreas de risco mostram que as vítimas do clima são as mesmas vítimas da desigualdade."},{...REP.fanon_condenados,dica:"Fanon mostra como a colonialidade distribui os ônus; a vulnerabilidade climática é uma forma contemporânea dessa distribuição desigual do risco."}],arg2:"O desmatamento da Amazônia e do Cerrado não é apenas uma crise ambiental local, mas um vetor global de emissões que compromete os compromissos climáticos do Brasil e do planeta.",rep2:[{...REP.amazonia_constituicao,dica:"O Art. 225 da CF garante o direito ao meio ambiente equilibrado; o desmatamento é uma violação constitucional que o Estado tem obrigação de combater."},{...REP.codigo_florestal,dica:"O Código Florestal estabelece áreas de preservação obrigatória; use para mostrar que a legislação existe, mas a fiscalização e a sancão são insuficientes."}],intervencao:{agente:"O Governo Federal",detalhamento:"responsável constitucional pela defesa do meio ambiente e pelo cumprimento dos acordos internacionais de combate às mudanças climáticas",acao:"deve intensificar o combate ao desmatamento, implementar o plano de adaptação climática para áreas de risco e liderar a transição para uma economia de baixo carbono",modo:"por meio de monitoramento por satélite, operações de fiscalização, reassentamento de populações em risco e investimento em energias renováveis",efeito:"protegendo as populações mais vulneráveis e cumprindo os compromissos internacionais do Brasil para um planeta mais estável"}}},
{id:10,titulo:"Desafios para garantir o direito à moradia nas periferias brasileiras",eixo:1,prob:"ALTA",fontes:["Profinho","Slides Eixo 1"],evidencias:"O déficit habitacional brasileiro é de 8 milhões de moradias (FGV, 2023). 13 milhões de pessoas vivem em favelas (IBGE). O programa Minha Casa Minha Vida foi retomado em 2023.",esquema:{rep_intro:[{...REP.ibge_desigualdade,dica:"Dados sobre déficit habitacional e distribuição das favelas mostram a dimensão e a geografia da exclusão; dão concretude ao argumento."},{texto:"OXFAM Brasil — Relatório \"Terra, Poder e Desigualdade\" (2022): concentração fundiária",tipo:"Dado/Pesquisa",dica:"Piketty mostra que a terra é um dos principais ativos que concentra riqueza; no Brasil, a especulação imobiliária é um mecanismo de exclusão dos mais pobres das áreas bem equipadas."}],arg1:"A ausência de moradia regular nas periferias urbanas é ao mesmo tempo causa e consequência da exclusão social, pois priva famílias de endereço formal, acesso a serviços e mobilidade urbana.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra que a colonialidade delimita quem ocupa os centros e quem é expulso para as periferias; a segregçaão urbanística brasileira é herança direta desse processo."},{texto:"IPEA — \"Segregação Urbana e Desigualdade\" (2020): barreiras de acesso entre centro e periferia",tipo:"Dado/Pesquisa",dica:"A democracia exige igualdade de condições; a cidade partida, com centro e periferia, é um exemplo de democracia incompleta onde a geografia determina os direitos."}],arg2:"A ocupação de áreas de risco por populações sem alternativa habitacional cria passivos ambientais e sociais, com vidas perdidas em deslizamentos e enchentes evitáveis.",rep2:[{...REP.mbembe_necro,dica:"O Estado que não garante moradia segura decide implicitamente quem está exposto ao risco de morte; a necropolítica aplicada ao urbano."},{...REP.amazonia_constituicao,dica:"O Art. 6º da CF garante a moradia como direito social; a falta de habitação digna é uma violação constitucional que o Estado tem obrigação de reparar."}],intervencao:{agente:"O Governo Federal",detalhamento:"controlador do Fundo Nacional de Habitação de Interesse Social e responsável pela coordenação da política habitacional nacional",acao:"deve ampliar o Minha Casa Minha Vida com foco em urbanização de favelas, regularização fundiária e reassentamento de famílias em áreas de risco",modo:"por meio de financiamento público, parcerias com cooperativas habitacionais e plano de uso do solo que inclua cota obrigatória de habitação social em áreas valorizadas",efeito:"garantindo a todo brasileiro o direito à moradia digna, com segurança e acesso a serviços urbanos"}}},
// Temas 11-30
{id:11,titulo:"Desafios para a proteção de trabalhadores em plataformas digitais no Brasil",eixo:8,prob:"ALTA",fontes:["Abimael Ferreira","Slides Eixo 8"],evidencias:"Brasil tem mais de 1,5 milhão de entregadores por aplicativo (IPEA, 2023). A regulamentação do trabalho por plataformas (UNIND — Lei 15.418/2026) foi aprovada em maio/2026. Mortes de entregadores cresceram 70% em 5 anos.",esquema:{rep_intro:[{texto:"Lei das Plataformas Digitais (UNIND) — Lei nº 15.418/2026",tipo:"Jurídico/Legal",dica:"A lei recém-aprovada regulamenta o trabalho por plataforma; use como ponto de partida mostrando que o Estado reconhece o problema, mas a implementação precisa ser monitorada."},{texto:"Fórum Econômico Mundial — \"Future of Jobs Report\" (2023): transformação do trabalho na era digital",tipo:"Dado/Pesquisa",dica:"Toffler preveniu a fragmentação do trabalho na era digital; use para contextualizar que a uberização é resultado estrutural da Terceira Onda, não apenas uma escolha empresarial."}],arg1:"A lógica algorítmica das plataformas cria uma relação de trabalho que mantém trabalhadores em dependência econômica sem lhes garantir os direitos trabalhistas clássicos: férias, 13º salário e aposentadoria.",rep1:[{texto:"Senacon/MJSP — Relatório sobre Concentração em Mercados Digitais (2023)",tipo:"Dado/Pesquisa",dica:"Piketty mostra como o capital concentra riqueza; as plataformas são um caso paradigmático: capturam enorme valor e transferem os riscos aos trabalhadores."},{...REP.ibge_desigualdade,dica:"Dados sobre informalidade mostram que o trabalho por plataforma concentra trabalhadores negros e de menor escolaridade; evidencia a dimensão racial da precarização."}],arg2:"A ausência de fiscalização efetiva e a assimetria de poder entre trabalhadores e big techs tornam a regulamentação insuficiente sem mecanismos de aplicação e sanção real.",rep2:[{texto:"Agência Nacional de Proteção de Dados (ANPD) — relatório sobre manipulação algorítmica (2023)",tipo:"Jurídico/Normativo",dica:"Chomsky mostra como o poder corporativo fabrica narrativas; aplique à narrativa das plataformas de que os entregadores são 'parceiros' para mascarar relação de trabalho subordinado."},{texto:"IPEA — \"Automação e Mercado de Trabalho Brasileiro\" (2021)",tipo:"Dado/Pesquisa",dica:"Harari discute o futuro do trabalho na era digital; use para mostrar que a precarização é uma escolha política, não uma inevitabilidade tecnológica."}],intervencao:{agente:"O Ministério do Trabalho e Emprego",detalhamento:"órgão com atribuição constitucional de defender a ordem jurídica trabalhista e fiscalizar o cumprimento dos direitos dos trabalhadores",acao:"deve fiscalizar o cumprimento da UNIND, criar registros obrigatórios de trabalhadores de plataformas e garantir acesso à Previdência Social",modo:"por meio de auditores fiscais especializados em economia digital, plataforma de registro on-line e contribuição previdenciária compartilhada entre trabalhador e plataforma",efeito:"assegurando que o trabalhador de plataforma digital tenha seus direitos fundamentais garantidos sem perder a flexibilidade que valoriza"}}},
{id:12,titulo:"Desafios para garantir o direito à educação de jovens e adultos e combater o analfabetismo no Brasil",eixo:2,prob:"ALTA",fontes:["Profinho","Aprova Total"],evidencias:"O Brasil tem 11 milhões de analfabetos e 30 milhões de analfabetos funcionais (IBGE, 2023). A EJA foi sistematicamente subfinanciada. O PNE 2026 estabelece meta de erradicação do analfabetismo até 2030.",esquema:{rep_intro:[{...REP.pne_2026,dica:"O PNE 2026 torna a erradicação do analfabetismo meta legal; use para mostrar que o Estado tem compromisso formal, mas os números mostram que a execução é o desafio."},{...REP.freire_pedagogia,dica:"Freire é o teórico brasileiro mais associado à alfabetização de adultos; citar o criador do método Paulo Freire no contexto da EJA é uma escolha natural e de alto impacto."}],arg1:"O analfabetismo funcional é um produto de um sistema educacional que não reteve os alunos nem garantiu aprendizagem efetiva, e exige políticas específicas de EJA com metodologias adequadas ao público adulto.",rep1:[{...REP.ibge_desigualdade,dica:"Dados mostram que o analfabetismo concentra-se entre idosos, negros e moradores do Norte e Nordeste; use para evidenciar a dimensão racial e regional do problema."},{texto:"IBGE/PNAD Contínua 2023 — desigualdade de acesso à educação por renda e cor/raça",tipo:"Dado/Pesquisa",dica:"Piketty mostra que desigualdade de educação perpetua desigualdade de renda; use para mostrar que o analfabetismo tem custo econômico e social de longo prazo."}],arg2:"O subfinanciamento histórico da EJA e a estigmatização dos adultos não-alfabetizados dificultam a demanda por políticas e perpetuam a exclusão.",rep2:[{...REP.mbembe_necro,dica:"O analfabetismo não é apenas falta de habilidade; é uma forma de exclusão da vida política e social. Mbembe ajuda a mostrar que isso não é acidente, mas produto de escolhas políticas."},{texto:"INAF — Indicador de Alfabetismo Funcional (2021): 29% dos brasileiros são analfabetos funcionais",tipo:"Dado/Pesquisa",dica:"Para Tocqueville, a democracia depende de cidadãos informados; o analfabetismo compromete a participação democrática, tornando o problema também uma questão de cidadania."}],intervencao:{agente:"O Governo Federal",detalhamento:"detentor da competência de coordenar o sistema nacional de educação e de financiar programas de alfabetização e escolarização de adultos",acao:"deve aumentar o financiamento da EJA, criar programa de alfabetização de adultos com metodologias contextualizadas e remunerar adequadamente os professores da modalidade",modo:"por meio de piso salarial específico para docentes da EJA, material didático adaptado e ampliação de escolas com funcionamento noturno",efeito:"garantindo a adultos e idosos não-alfabetizados o pleno exercício da cidadania e a autonomia que o conhecimento da leitura e da escrita proporciona"}}},
{id:13,titulo:"Perspectivas para a democratização da energia limpa e renovável no Brasil",eixo:6,prob:"ALTA",fontes:["Profinho","Elias Ancelmo"],evidencias:"A Lei do Gás do Povo (Lei 15.348/2026) criou um programa de energia para populações vulneráveis. O Brasil tem potencial solar e eólico entre os maiores do mundo, mas 3% dos domicílios ainda não têm energia elétrica (IBGE).",esquema:{rep_intro:[{texto:"Lei do Gás do Povo — Lei nº 15.348/2026",tipo:"Jurídico/Legal",dica:"A lei recém-aprovada aborda energia e pobreza energética; use como evidência de que o Estado começa a reconhecer o direito à energia como direito social."},{...REP.paris_clima,dica:"O Acordo de Paris compromete o Brasil a reduzir emissões; a transição para energia limpa é obrigação internacional, não opção."}],arg1:"Apesar do enorme potencial renovável brasileiro, a energia limpa ainda chega desigualmente à população: comunidades rurais, quilombolas e indígenas permanecem sem acesso, reproduzindo desigualdades históricas.",rep1:[{...REP.ibge_desigualdade,dica:"Dados do IBGE sobre acesso à energia elétrica mostram concentração de exclusão em comunidades indígenas e quilombolas; dão concretude ao argumento."},{...REP.fanon_condenados,dica:"Fanon mostra como a colonialidade exclui determinados grupos de recursos básicos; a falta de energia em comunidades indígenas e quilombolas é herança colonial."}],arg2:"A transição energética no Brasil enfrenta barreiras estruturais: a dependência de combustíveis fósseis, a influência do lobby do petróleo e a ausência de linhas de financiamento acessíveis para pequenos produtores de energia solar.",rep2:[{...REP.onu_biodiversidade,dica:"O Acordo de Kunming-Montréal exige transição para uma economia de baixo carbono; coloca o Brasil sob pressão internacional para acelerar a transição energética."},{texto:"Transparência Internacional Brasil — \"Lobby e Democracia\" (2023): influência setorial no Congresso",tipo:"Dado/Pesquisa",dica:"Chomsky mostra como lobbies poderosos bloqueiam mudanças; aplique ao lobby do combustível fóssil que retarda a transição para renováveis no Brasil."}],intervencao:{agente:"O Estado brasileiro",detalhamento:"controlador da matriz energética nacional e responsável pelos incentivos fiscais e pelo financiamento público da transição para fontes renováveis",acao:"deve universalizar o acesso à energia elétrica por meio de programas de instalação solar fotovoltaica em comunidades remotas e ampliar o Programa Luz para Todos",modo:"mediante financiamento público subsidiado, parcerias com cooperativas de energia e regulamentação do mercado de energia distribuída",efeito:"garantindo à toda população brasileira o acesso à energia limpa como direito social básico e contribuindo para os compromissos climáticos internacionais do país"}}},
{id:14,titulo:"Desafios para o combate ao racismo ambiental no Brasil",eixo:6,prob:"ALTA",fontes:["Abimael Ferreira"],evidencias:"Comunidades negras, indígenas e quilombolas concentram 80% das áreas próximas a lixões e poluidores (IBGE/MapBiomas, 2023). O conceito de racismo ambiental foi popularizado por Robert Bullard (1990).",esquema:{rep_intro:[{...REP.mbembe_necro,dica:"Mbembe é a referência teórica mais direta para racismo ambiental; a necropolítica explica por que certas comunidades são expostas a riscos que outras não enfrentam."},{...REP.fanon_condenados,dica:"Fanon mostra como a colonialidade distribui os recursos e os riscos desigualmente; o racismo ambiental é uma forma contemporânea de colonialidade territorial."}],arg1:"A localização de indústrias poluidoras, lixões e projetos de infraestrutura de alto impacto em territórios habitados por comunidades negras, indígenas e quilombolas revela um padrão estrutural de injustiça ambiental.",rep1:[{...REP.ibge_desigualdade,dica:"Dados do IBGE sobre distribuição espacial de instalações poluidoras mostram a concentração em comunidades vulneráveis; dão base empírica ao argumento."},{...REP.ipcc_clima,dica:"O IPCC mostra que as mudanças climáticas agravam a vulnerabilidade já existente; articule ao racismo ambiental para mostrar a dupla punição das comunidades mais vulnerabilizadas."}],arg2:"A ausência de participação das comunidades afetadas nos processos de licenciamento ambiental perpetua a invisibilidade de seus direitos.",rep2:[{...REP.amazonia_constituicao,dica:"O Art. 225 garante o direito ao meio ambiente equilibrado; use para mostrar que o racismo ambiental é uma violação constitucional."},{texto:"Boaventura de Sousa Santos — \"Renovar a Teoria Crítica e Reinventar a Emancipação Social\" (2006)",tipo:"Teórico/Filosófico",dica:"Para Tocqueville, democracia implica igualdade de participação; a exclusão de comunidades do licenciamento ambiental é um déficit democrático."}],intervencao:{agente:"O Ibama e os órgãos ambientais estaduais",detalhamento:"detentor da obrigação constitucional de proteger o meio ambiente e os direitos das populações tradicionais que habitam as áreas mais vulneráveis ao racismo ambiental",acao:"devem exigir consulta prévia, livre e informada das comunidades afetadas em todos os processos de licenciamento ambiental",modo:"por meio da regulamentação da Convenção 169 da OIT, criação de câmaras de participação comunitária e responsabilização de empresas por danos ambientais em territórios tradicionais",efeito:"garantindo que as comunidades mais vulnerabilizadas tenham voz nas decisões que afetam seus territórios e sua saúde"}}},
{id:15,titulo:"Perspectivas para a inclusão social de pessoas com deficiência no Brasil",eixo:1,prob:"ALTA",fontes:["SAE simulados","Slides Eixo 1"],evidencias:"O Brasil tem 18,6 milhões de pessoas com deficiência (IBGE, 2022). A LBI (2015) é um marco, mas taxa de desemprego de PcD é 6x maior que a média. PNE 2026 inclui metas específicas de inclusão.",esquema:{rep_intro:[{...REP.brasil_200,dica:"A LBI é o marco legal central; use para mostrar que o Brasil tem legislação avançada, mas enfrenta lacunas na implementação."},{texto:"Convenção da ONU sobre os Direitos das Pessoas com Deficiência (2006)",tipo:"Internacional/ONU",dica:"O Brasil foi um dos primeiros países a ratificar com status constitucional; cite para mostrar o compromisso internacional assumido."}],arg1:"A ausência de acessibilidade urbana e arquitetônica em espaços públicos, transportes e edifícios priva pessoas com deficiência de exercer plenamente sua cidadania e autonomia.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre acesso ao mercado de trabalho e à educação por pessoas com deficiência mostram exclusão estrutural; dão concretude ao argumento."},{...REP.freire_pedagogia,dica:"Freire defende a educação como instrumento de emancipação; use para argumentar que a inclusão educacional de PcD é pressuposto de emancipação."}],arg2:"O modelo clássico de inclusão, centrado na adaptação da pessoa ao ambiente, precisa ser substituído pelo modelo social, em que é o ambiente que se adapta à diversidade humana.",rep2:[{texto:"IBGE — Censo 2022: 18,6 milhões de PcD e dados de acesso a serviços essenciais",tipo:"Dado/Pesquisa",dica:"A democracia de Tocqueville pressupõe igualdade de condições; a exclusão de PcD é um deficit democrático."},{...REP.mbembe_necro,dica:"O Estado que não garante acessibilidade decide, ainda que implicitamente, quem participa da vida social; necropolítica aplicada à deficiência."}],intervencao:{agente:"Os municípios brasileiros",detalhamento:"responsável pela implementação da Lei Brasileira de Inclusão e pela fiscalização do cumprimento do direito à acessibilidade e à participação plena das pessoas com deficiência",acao:"devem elaborar planos municipais de acessibilidade universal, priorizando transporte público, calçadas e edifícios públicos",modo:"mediante obrigatoriedade de relatórios anuais de acessibilidade, multas por descumprimento e incentivos fiscais para empresas que contratam PcD acima da cota legal",efeito:"garantindo que pessoas com deficiência possam exercer plenamente seus direitos de cidadania, mobilidade e participação social"}}},
{id:16,titulo:"Perspectivas para o reconhecimento das línguas indígenas como patrimônio cultural brasileiro",eixo:3,prob:"MEDIA_ALTA",fontes:["Slides Eixo 3"],evidencias:"O Brasil tem 274 etnias e 305 línguas indígenas (IBGE/Funai), mas mais de 50% estão em risco de extinção. A CF/1988 garante o uso das línguas maternas, mas políticas de implementação são insuficientes.",esquema:{rep_intro:[{texto:"IPHAN — Política Nacional do Patrimônio Cultural Imaterial (Decreto 3.551/2000)",tipo:"Jurídico/Normativo",dica:"Benjamin mostra que a cultura não é apenas produto artístico, mas memória e identidade; aplique à língua indígena como suporte de memória coletiva irreplaceável."},{texto:"Convenção para a Salvaguarda do Patrimônio Cultural Imaterial — UNESCO (2003)",tipo:"Internacional/ONU",dica:"A UNESCO reconhece línguas como patrimônio imaterial; use para dar dimensão internacional e elevar o debate para além do direito estritamente nacional."}],arg1:"A morte de uma língua representa a perda irreversível de formas únicas de compreender o mundo, a natureza e as relações humanas, empobrecendo toda a humanidade.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra que o colonialismo destrói a língua como forma de apagar a identidade; a pressão sobre as línguas indígenas é continuação do processo colonial."},{...REP.ibge_desigualdade,dica:"Dados sobre escolaridade e condições de vida de indígenas mostram que a perda linguística acompanha a exclusão social."}],arg2:"A educação escolar indígena, quando desvinculada das línguas maternas, reproduz o apagamento cultural e gera uma geração sem raízes.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a educação a partir da palavra do próprio educando; a educação indígena na língua materna é a aplicação mais radical desse princípio."},{...REP.amazonia_constituicao,dica:"O Art. 210 da CF garante o uso das línguas maternas na educação indígena; use para mostrar que há obrigação constitucional, mas faltam políticas."}],intervencao:{agente:"O Ministério da Educação e o Ministério dos Povos Indígenas",detalhamento:"responsável pela política de cotas nas instituições federais de ensino e pelo financiamento das condições de permanência de estudantes indígenas no ensino superior",acao:"devem ampliar as escolas com educação bilíngue diferenciada, financiar projetos de documentação linguística e criar um atlas digital das línguas indígenas em risco",modo:"por meio de contratação de professores indígenas com formação específica, produção de material didático nas línguas locais e plataformas digitais de preservação",efeito:"garantindo às comunidades indígenas o direito à sua identidade cultural e à transmissão de seus saberes às gerações futuras"}}},
{id:17,titulo:"Caminhos para a preservação do patrimônio cultural brasileiro",eixo:3,prob:"MEDIA_ALTA",fontes:["Leonardo Costa","Profinho"],evidencias:"O IPHAN registra mais de 1.500 bens tombados, mas opera cronicamente subfinanciado. O incêndio do Museu Nacional (2018) expôs a vulnerabilidade do patrimônio público. Em 2026, o MEC Livros amplia o debate sobre patrimônio imaterial.",esquema:{rep_intro:[{texto:"UNESCO — Convenção para a Salvaguarda do Patrimônio Cultural Imaterial (2003)",tipo:"Jurídico/Normativo",dica:"Benjamin mostra que a obra de arte carrega a memória de uma época; use para mostrar que o patrimônio cultural é a memória coletiva materializada — e que sua perda é irrecuperável."},{texto:"Convenção para a Salvaguarda do Patrimônio Cultural Imaterial — UNESCO (2003)",tipo:"Internacional/ONU",dica:"A UNESCO reconhece o patrimônio imaterial; cite para mostrar que o Brasil tem obrigações internacionais de preservação."}],arg1:"O subfinanciamento crônico do IPHAN e das instituições culturais públicas coloca em risco bens tombados e museus, tornando o Brasil um país que consome sua própria memória histórica.",rep1:[{...REP.ibge_desigualdade,dica:"A distribuição desigual do investimento cultural deixa regiões Norte e Nordeste com menos recursos de preservação; evidencia a dimensão regional do problema."},{texto:"Cândido Portinari — Os Retirantes (1944)",tipo:"Cultural/Arte",dica:"Os Retirantes de Portinari, pintados em 1944, imortalizaram o drama do deslocamento forçado e da miséria; a tela é documento histórico e artístico que exige do Estado o compromisso com a preservação da memória nacional."}],arg2:"A valorização do patrimônio cultural envolve também o reconhecimento dos saberes, festas e tradições das comunidades tradicionais, que frequentemente não entram nos critérios oficiais de tombamento.",rep2:[{...REP.fanon_condenados,dica:"Fanon mostra que o colonialismo impõe critérios eurocentric sobre o que tem valor; aplique à exclusão do patrimônio afro-brasileiro e indígena dos mecanismos de preservação."},{...REP.freire_pedagogia,dica:"Freire defende a valorização da cultura popular; use para argumentar que a preservação do patrimônio deve partir das comunidades, não apenas do Estado."}],intervencao:{agente:"O Ministério da Cultura",detalhamento:"guardião constitucional do patrimônio cultural brasileiro, com competência para tombamento, registro e financiamento de bens culturais de valor histórico",acao:"deve ampliar o financiamento do IPHAN, criar programa nacional de digitalização do patrimônio e incluir comunidades tradicionais nos processos de registro e salvaguarda",modo:"por meio de aumento de orçamento, parcerias com universidades para formação de restauradores e plataforma digital de acervo do patrimônio brasileiro",efeito:"protegendo a memória cultural brasileira para as gerações futuras e democratizando o acesso ao patrimônio"}}},
{id:18,titulo:"Desafios para a promoção da saúde da população negra no Brasil",eixo:7,prob:"MEDIA_ALTA",fontes:["Assistant-added"],evidencias:"A Política Nacional de Saúde Integral da População Negra (2009) existe, mas mortalidade materna negra é 3x maior que a branca (MS, 2023). O racismo como determinante social de saúde é reconhecido pela OMS.",esquema:{rep_intro:[{...REP.mbembe_necro,dica:"A necropolítica explica por que populações negras têm piores indicadores de saúde; o Estado, ao omitir políticas específicas, decide implicitamente quem vive e quem morre."},{...REP.onu_saude_mental,dica:"O relatório da OMS (2022) reconhece o racismo como determinante social de saúde; use para dar legitimidade científica internacional ao argumento."}],arg1:"O racismo institucional no sistema de saúde — que se manifesta no subdiagnóstico, no atendimento desumanizado e na subalocação de recursos em regiões de maioria negra — resulta em indicadores de mortalidade sistematicamente piores.",rep1:[{...REP.fanon_condenados,dica:"Fanon analisa o impacto do racismo sobre o corpo; aplique à saúde para mostrar que o adoecimento da população negra é produto de estruturas racistas, não de diferenças biológicas."},{...REP.ibge_desigualdade,dica:"Dados do IBGE sobre mortalidade, expectativa de vida e acesso à saúde por cor/raça evidenciam a desigualdade racial na saúde de forma inconteste."}],arg2:"A ausência de abordagem específica da saúde da mulher negra — que enfrenta a dupla vulnerabilidade do gênero e da raça — resulta em mortalidade materna desproporcionalmente alta.",rep2:[{...REP.sus_saude_mental,dica:"O SUS é universal, mas universalidade não garante equidade; use a Lei 10.216 como analogia para mostrar que o princípio da equidade exige políticas focalizadas."},{...REP.freire_pedagogia,dica:"Freire defende a leitura crítica do mundo; aplique à formação de profissionais de saúde que devem reconhecer e combater o racismo institucional."}],intervencao:{agente:"O Ministério da Saúde",detalhamento:"responsável pela Política Nacional de Saúde Integral da População Negra, incluída no SUS desde 2009, e pelo enfrentamento das desigualdades raciais no acesso à saúde",acao:"deve implementar a Política Nacional de Saúde Integral da População Negra com metas mensuráveis e incluir o quesito raça/cor em todos os sistemas de informação em saúde",modo:"por meio de capacitação antirracista dos profissionais de saúde, implantação de clínicas de saúde da mulher negra e indicadores de equidade racial nas metas do SUS",efeito:"reduzindo as desigualdades raciais em saúde e garantindo à população negra o direito à vida e à saúde em condições de igualdade"}}},
{id:19,titulo:"Desafios para garantir o direito ao transporte público de qualidade no Brasil",eixo:1,prob:"MEDIA_ALTA",fontes:["Elias Ancelmo"],evidencias:"A Lei do Transporte Público (Lei 15.432/2026) foi aprovada em junho/2026. Pesquisas apontam que 60% dos usuários de ônibus nas capitais gastam mais de 2 horas por dia em deslocamento.",esquema:{rep_intro:[{texto:"Lei do Transporte Público — Lei nº 15.432/2026",tipo:"Jurídico/Legal",dica:"A lei recém-aprovada estabelece diretrizes para o transporte público; use como ponto de partida mostrando que há reconhecimento legal, mas implementação é o desafio."},{...REP.ibge_desigualdade,dica:"Dados sobre tempo de deslocamento e renda mostram que trabalhadores de baixa renda gastam proporcionalmente mais tempo e dinheiro no transporte."}],arg1:"A precariedade do transporte público nas periferias urbanas amplia as desigualdades sociais, pois impõe ônus maior aos trabalhadores de menor renda, que dependem do ônibus para acessar emprego, saúde e educação.",rep1:[{texto:"IPEA — \"Mobilidade Urbana e Direito à Cidade\" (2020): acesso ao transporte por faixa de renda",tipo:"Dado/Pesquisa",dica:"A desigualdade de acesso ao transporte é uma forma de capital espacial que se reproduz; trabalhadores pobres gastam mais tempo e dinheiro para acessar as mesmas oportunidades."},{...REP.mbembe_necro,dica:"A precariedade do transporte que mantém trabalhadores periféricos confinados a certas áreas é uma forma de controle espacial que Mbembe ajuda a nomear."}],arg2:"A falta de investimento em modal de alta capacidade — metrô, BRT, VLT — nas cidades médias e grandes perpetua a dependência do ônibus lento e superlotado, gerando impactos na produtividade e na qualidade de vida.",rep2:[{texto:"Ministério das Cidades — PNMU: diretrizes para transporte e mobilidade urbana",tipo:"Jurídico/Normativo",dica:"Toffler previu que a terceira onda exigiria mobilidade e conexão; um transporte público ruim é uma barreira ao desenvolvimento econômico e social no século XXI."},{texto:"IPEA — \"Mobilidade Urbana e Direito à Cidade\" (2020): transporte como vetor de inclusão",tipo:"Dado/Pesquisa",dica:"A democracia exige igualdade de acesso às oportunidades; o transporte é a infraestrutura que viabiliza ou bloqueia esse acesso."}],intervencao:{agente:"Os municípios e estados",detalhamento:"detentor dos recursos federais de infraestrutura urbana e responsável por induzir os municípios a priorizar o transporte coletivo na execução do plano de mobilidade urbana",acao:"devem expandir o transporte público de alta capacidade, integrar modais e revisar as tarifas com subsídio governamental",modo:"por meio de concessões reguladas, parcerias público-privadas com exigência de qualidade e gratuidade para grupos vulneráveis",efeito:"garantindo a todos os brasileiros o direito à mobilidade urbana e reduzindo as desigualdades de acesso às oportunidades nas cidades"}}},
{id:20,titulo:"Os impactos da desinformação nas plataformas digitais no Brasil",eixo:4,prob:"MEDIA_ALTA",fontes:["SAE simulados","Slides Eixo 4"],evidencias:"O Brasil está entre os países com maior circulação de fake news no WhatsApp (Reuters Institute, 2024). A desinformação sobre vacinas causou surtos de sarampo em 2023–24. PL das Fake News tramita no Congresso desde 2020.",esquema:{rep_intro:[{texto:"TSE — Resolução 23.714/2022 e Relatório de Combate à Desinformação Eleitoral (2022)",tipo:"Jurídico/Normativo",dica:"Chomsky mostra como a mídia pode manipular a opinião; aplique às redes sociais que permitem que qualquer usuário se torne produtor de desinformação em escala."},{texto:"Instituto Reuters/Oxford — Relatório de Notícias Digitais 2024: Brasil lidera desinformação",tipo:"Dado/Pesquisa",dica:"Bauman mostra que as certezas sólidas se diluíram na modernidade líquida; a desinformação prospera nesse ambiente de incerteza e desconfiança das instituições."}],arg1:"Os algoritmos das plataformas digitais, projetados para maximizar o engajamento, priorizam conteúdo emocional e polarizador, criando câmaras de eco que amplificam a desinformação e corroem o debate democrático.",rep1:[{texto:"Instituto Reuters/Oxford — Digital News Report 2024: câmaras de eco e polarização algorítmica",tipo:"Dado/Pesquisa",dica:"Harari discute como algoritmos moldam percepções da realidade; aplique às bolhas de desinformação para mostrar que a IA das plataformas é corresponsavel pelo problema."},{...REP.lgpd,dica:"A LGPD regula dados, mas não os algoritmos de recomendação; mostre que o Brasil precisa de regulação complementar para os mecanismos que amplificam fake news."}],arg2:"A ausência de educação midiática nas escolas deixa a população, especialmente os mais jovens, despreparada para identificar e questionar conteúdos falsos.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a leitura crítica do mundo; a educação midiática é a aplicação desse princípio no século XXI."},{texto:"Educação midiática — Programa MEC (2026)",tipo:"Jurídico/Legal",dica:"O programa do MEC de 2026 introduz educação midiática nas escolas; cite para mostrar que o Estado começa a agir, mas é preciso acelerar."}],intervencao:{agente:"O Estado brasileiro",detalhamento:"detentor da competência de regular as comunicações, fiscalizar as plataformas digitais e estabelecer os marcos legais de combate à desinformação",acao:"deve aprovar o Marco Regulatório das Plataformas Digitais, incluir educação midiática no currículo e exigir transparência algorítmica das big techs",modo:"por meio de legislação, parcerias com fact-checkers independentes, obrigatoriedade de rotulação de conteúdo gerado por IA e programa nacional de alfabetização digital",efeito:"fortalecendo a democracia brasileira contra a desinformação e garantindo o direito da população à informação de qualidade"}}},
// Temas 21-40
{id:21,titulo:"Desafios para garantir o acesso de povos indígenas ao ensino superior no Brasil",eixo:2,prob:"MEDIA_ALTA",fontes:["Slides Eixo 2"],evidencias:"Apenas 0,4% dos estudantes de ensino superior são indígenas (INEP, 2023). A Lei de Cotas prevê vagas, mas permanência é o desafio. PNE 2026 inclui metas para inclusão de grupos sub-representados.",esquema:{rep_intro:[{...REP.pne_2026,dica:"O PNE estabelece metas de inclusão; use para mostrar que há compromisso formal, mas a execução é o desafio."},{...REP.fanon_condenados,dica:"Fanon mostra como o colonialismo exclui grupos de espaços de produção de conhecimento; a sub-representação indígena no ensino superior é herança colonial direta."}],arg1:"Barreiras econômicas, culturais e geográficas — como a distância das aldeias dos campi e a falta de apoio financeiro — tornam o ingresso de indígenas no ensino superior uma conquista fraqueja pela ausência de políticas de permanência.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre escolaridade e renda de indígenas mostram que a desigualdade educacional é estrutural e multidimensional."},{...REP.freire_pedagogia,dica:"Freire defende a educação como instrumento de emancipação; o acesso indígena à universidade deve ser acompanhado de valorização dos saberes ancestrais."}],arg2:"A universidade, ao não integrar os saberes indígenas aos currículos, perpetua a visaão colonial de que o conhecimento científico eurocentíco é superior ao saber traditional.",rep2:[{...REP.mbembe_necro,dica:"Mbembe chama de necropolítica epistemicá a eliminação de formas de saber não ocidentais; aplique ao currículo universitário que apaga os saberes indígenas."},{texto:"IPHAN — Relatório sobre Patrimônio Vivo e Saberes Tradicionais Indígenas (2022)",tipo:"Jurídico/Normativo",dica:"Benjamin mostra que a cultura carrega memória; os saberes indígenas são acervo cultural que a universidade deve preservar, não subordinar."}],intervencao:{agente:"O MEC e as instituições federais de ensino superior",detalhamento:"responsável pelas políticas de acesso e permanência de estudantes indígenas nas universidades federais, incluindo as cotas e o auxílio permanência",acao:"devem ampliar as políticas de permanência — moradia, bolsas, tutoria — e criar currículos que integrem saberes indígenas",modo:"por meio de recursos do FIES e PROUNI dirigidos especificamente a estudantes indígenas, núcleos de estudos indígenas nas universidades e docentes indígenas contratados",efeito:"garantindo que indígenas possam acessar, permanecer e contribuir ao ensino superior sem abrir mão de sua identidade cultural"}}},
{id:22,titulo:"Desafios para a inclusão de estudantes com TDAH e altas habilidades no sistema educacional brasileiro",eixo:2,prob:"MEDIA_ALTA",fontes:["Bella Nazar","Slides Eixo 2"],evidencias:"Estima-se que 5–7% das crianças tenham TDAH (APA, 2023). No Brasil, menos de 20% dos municípios têm serviços de atendimento educacional especializado para além da deficiência física. O PNE 2026 inclui AEE como meta.",esquema:{rep_intro:[{...REP.pne_2026,dica:"O PNE prevê AEE para todos os alunos com necessidades especiais; use para mostrar que há meta formal, mas a implementação ainda é incipiente para TDAH e altas habilidades."},{...REP.onu_crianca,dica:"A Convenção da ONU garante à criança educação que respeite suas características individuais; TDAH e altas habilidades exigem olhar individualizado."}],arg1:"O modelo educacional padronizado, centrado na atenção prolongada e na memorização, penaliza estudantes com TDAH e deixa de estimular o potencial de alunos com altas habilidades, gerando exclusão e subdesenvolvimento de talentos.",rep1:[{...REP.freire_pedagogia,dica:"Freire critica a educação bancária que ignora a singularidade do educando; estudantes com TDAH e altas habilidades precisam de abordagens que reconheçam sua diferença como riqueza."},{...REP.ibge_desigualdade,dica:"Dados mostram que estudantes de baixa renda com TDAH são mais propensos ao abandono escolar por falta de diagnóstico e suporte; evidencia a intersecção entre neuro-diversidade e desigualdade social."}],arg2:"A falta de formação docente para identificar e atender estudantes com TDAH e altas habilidades é um gargalo crítico que transforma diferenças neurológicas em fracasso escolar.",rep2:[{texto:"INEP — Censo Escolar 2023: déficit de matrículas e inclusão de estudantes com deficiência",tipo:"Dado/Pesquisa",dica:"Bauman mostra que a modernidade descarta quem não se encaixa no padrão; estudantes com TDAH são descartados por um sistema que não foi projetado para sua forma de aprender."},{texto:"OCDE — \"Educação 2030\": competências socioemocionais e criatividade como habilidades do futuro",tipo:"Dado/Pesquisa",dica:"Harari mostra que o século XXI valorizará criatividade e pensamento não-linear; estudantes com altas habilidades são o tipo de capital humano que o Brasil precisa cultivar."}],intervencao:{agente:"O MEC e as secretarias de educação estaduais",detalhamento:"responsáveis, respectivamente, pela estrutura do currículo da educação básica e pelo suporte psicológico dentro das escolas públicas",acao:"devem capacitar professores para identificar TDAH e altas habilidades, criar salas de recursos multifuncionais e estabelecer fluxo de encaminhamento para diagnóstico e apoio especializado",modo:"por meio de formação continuada de docentes, parcerias com universidades para avaliação gratuita e ampliação das salas de AEE em todas as escolas públicas",efeito:"garantindo que cada estudante, qualquer que seja sua neurologia, tenha a chance de desenvolver seu pleno potencial na escola brasileira"}}},
{id:23,titulo:"Perspectivas para a valorização dos professores da educação básica no Brasil",eixo:2,prob:"MEDIA_ALTA",fontes:["Profinho","Slides Eixo 2"],evidencias:"Brasil tem um dos menores salários docentes em relação ao PIB per capita da OCDE (2023). 40% dos professores de matemática e ciências não têm formação na área (INEP). O PNE 2026 inclui piso salarial e planos de carreira.",esquema:{rep_intro:[{...REP.pne_2026,dica:"O PNE 2026 estabelece metas de valorização docente; use para mostrar que há reconhecimento legal, mas a concretização depende de vontade política e financiamento."},{...REP.freire_pedagogia,dica:"Freire colocou o professor como mediador da emancipação; desvalorizar o docente é minar a capacidade transformadora da educação."}],arg1:"A desvalorização salarial e as condições precárias de trabalho afastam jovens talentosos da carreira docente e sobrecarregam os que permanecem, comprometendo a qualidade do ensino.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre remuneração e jornada docente mostram que o professor brasileiro trabalha mais e ganha menos do que a média dos países com sistemas educacionais de qualidade."},{texto:"OXFAM Brasil — Relatório \"A Distância que nos Une\" (2023): concentração de renda e riqueza no Brasil",tipo:"Dado/Pesquisa",dica:"Piketty mostra que a educação é o principal mecanismo de redução da desigualdade; um professor mal pago é um investimento mal feito pelo Estado."}],arg2:"A ausência de planos de carreira atrativos e de formação continuada de qualidade resulta na estagnação profissional e no esgotamento de professores, fenômeno crescente no Brasil pós-pandemia.",rep2:[{...REP.byung_chul,dica:"Han mostra que a sociedade do desempenho produz esgotamento; o professor sobrecarregado, subpago e desvalorizado é uma vítima da demanda por resultado sem condições adequadas."},{...REP.onu_saude_mental,dica:"A OMS aponta o burnout docente como crise de saúde pública; cite para mostrar que a questão não é apenas salarial, mas de saúde e dignidade profissional."}],intervencao:{agente:"O Governo Federal e os estados",detalhamento:"responsável constitucional pela valorização dos profissionais da educação e pelo cumprimento do piso salarial nacional do magistério",acao:"devem implementar integralmente o piso salarial nacional do magistério, criar planos de carreira com progressão por formação e ampliar programas de formação continuada",modo:"por meio de vinculação constitucional de percentual do PIB à valorização docente, Fundeb com distribuição equitativa e programa nacional de residência pedagógica",efeito:"tornando a carreira docente atrativa para os melhores profissionais e garantindo que toda criança brasileira tenha um professor valorizado e motivado"}}},
{id:24,titulo:"Perspectivas para a democratização da leitura no Brasil",eixo:3,prob:"MEDIA_ALTA",fontes:["Abimael Ferreira","Slides Eixo 3"],evidencias:"44% dos brasileiros não lêm regularmente (Retratos da Leitura, 2020). Em 2026, o Programa Nacional do Livro foi retomado. O Brasil é o 8º maior mercado editorial do mundo, mas a distribuição é extremamente desigual.",esquema:{rep_intro:[{...REP.freire_pedagogia,dica:"Para Freire, ler é ler o mundo antes de ler a palavra; a leitura é instrumento de emancipação, e sua negação é uma forma de manutenção da opressão."},{texto:"Patativa do Assaré — cordelista e poeta popular (séc. XX)",tipo:"Cultural/Literatura",dica:"Patativa do Assaré, que não concluiu o ensino formal, tornou-se um dos maiores poetas do Brasil; sua trajetória mostra que a negação da leitura formal não apaga a inteligência popular — e que democratizar a leitura é reconhecer essa riqueza."}],arg1:"O preço elevado dos livros e a ausência de bibliotecas públicas e escolares bem equipadas criam barreiras de acesso que concentram a cultura letrada nas classes mais favorecidas.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre acesso a livros e hábitos de leitura por faixa de renda mostram a correlação entre pobreza e exclusão literária."},{texto:"IBGE/PNAD Contínua 2023 — desigualdade de acesso à educação por renda e cor/raça",tipo:"Dado/Pesquisa",dica:"Piketty mostra que o capital cultural é tão concentrado quanto o capital econômico; a falta de acesso ao livro é uma das formas pelas quais se perpetua a desigualdade."}],arg2:"A ausência de estímulo à leitura na infância, agravada pela concorrência das telas, cria adultos que não leem por hábito, comprometendo a formação crítica e a cidadania.",rep2:[{texto:"Retratos da Leitura no Brasil (IPL, 2020): queda na proporção de leitores em uma década",tipo:"Dado/Pesquisa",dica:"Bauman mostra que na modernidade líquida a atenção se fragmenta; o livro, que exige imersão e concentração, é um contrapeso à cultura do scroll infinito."},{texto:"Patativa do Assaré — cordelista e poeta popular (séc. XX)",tipo:"Cultural/Literatura",dica:"Patativa do Assaré aprendeu a ler sozinho e mesmo assim produziu obra de alcance universal; use para mostrar que o analfabetismo não é ausência de inteligência, mas de oportunidade — e que o Estado deve garantir esse acesso.sinformação."}],intervencao:{agente:"O Ministério da Educação e o Ministério da Cultura",detalhamento:"controlador dos recursos do Programa Nacional do Livro e do Material Didático e responsável pela política pública de distribuição de obras literárias às escolas e bibliotecas",acao:"devem ampliar o PNBE — Programa Nacional Biblioteca da Escola —, criar rede de bibliotecas comunitárias nas periferias e garantir lições de leitura em todos os anos da educação básica",modo:"por meio de compra pública de acervo diversificado, formação de mediadores de leitura nas escolas e isenção fiscal para livros",efeito:"construindo um Brasil de leitores, com maior capacidade crítica, empatia e participação democrática"}}},
{id:25,titulo:"Desafios para a proteção dos povos indígenas no Brasil",eixo:1,prob:"MEDIA_ALTA",fontes:["Slides Eixo 1","Elias Ancelmo"],evidencias:"O Brasil tem 305 povos indígenas (IBGE, 2022). A demarcação de terras é constante objeto de disputas políticas. O Brasil sediou a COP30 e assumiu compromissos internacionais com povos tradicionais.",esquema:{rep_intro:[{...REP.fanon_condenados,dica:"Fanon analisa como o colonialismo despossui os povos de seus territórios; a luta pela demarcação de terras indígenas é a continuação atual desse processo de resistência."},{...REP.amazonia_constituicao,dica:"O Art. 231 da CF reconhece os direitos originários dos indígenas sobre suas terras; a não-demarcação é uma violação constitucional que o Estado tem obrigação de sanar."}],arg1:"A não-demarcação de terras indígenas, aliada à expansão do agronegócio e à pressão dos garimpeiros, resulta em conflitos territórias, mortes e destruição de culturas milenares.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre violência e mortalidade em comunidades indígenas mostram que a negligência estatal tem custo em vidas humanas."},{...REP.mbembe_necro,dica:"A necropolítica é exercida sobre corpos indígenas quando o Estado recusa demarcação e permite o garimpo ilegal; quem tem o poder de delimitar territórios determina quem vive."}],arg2:"A invisibilização dos indígenas nas políticas públicas — saúde, educação, previdência — agrava as desigualdades e faz com que esses grupos sejam sistematicamente excluídos dos avanços sociais do país.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a voz do oprimido no processo educativo; as políticas para povos indígenas só serão eficazes se forem construídas com eles, não para eles."},{...REP.onu_biodiversidade,dica:"O Acordo de Kunming-Montréal reconhece o papel dos povos indígenas na conservação da biodiversidade; proteger os indígenas é proteger o meio ambiente."}],intervencao:{agente:"A FUNAI e o Ministério dos Povos Indígenas",detalhamento:"detentor da obrigação constitucional de demarcar e proteger as terras indígenas, garantindo a sobrevivência física e cultural dos povos originários",acao:"devem acelerar a demarcação de terras, combater o garimpo ilegal e garantir acesso universal a saúde e educação diferenciadas",modo:"por meio de reforço do efetivo da FUNAI, operações conjuntas com PF e Forças Armadas contra garimpo e criação de saúde indígena específica no SUS",efeito:"garantindo aos povos indígenas o exercício pleno de seus direitos constitucionais, a preservação de seus territórios e a reprodução de suas culturas"}}},
{id:26,titulo:"Perspectivas para a conservação da Amazônia brasileira",eixo:6,prob:"MEDIA_ALTA",fontes:["Slides Eixo 6","Elias Ancelmo"],evidencias:"A Amazônia perdeu 17% de cobertura vegetal nas últimas décadas (INPE). Em 2023, o desmatamento caiu 50% mas os dados de 2025-26 mostram rebote. O Brasil sediará a COP30 em Belém.",esquema:{rep_intro:[{...REP.amazonia_constituicao,dica:"O Art. 225 da CF garante o direito ao meio ambiente equilibrado; a Amazônia é o bem mais importante nessa garantia e sua destruição é inconstitucional."},{...REP.paris_clima,dica:"O Brasil assumiu compromissos no Acordo de Paris que dependem da Amazônia em pé; desmatamento é descumprimento de obrigação internacional."}],arg1:"O desmatamento da Amazônia, impulsionado pelo avanço da fronteira agropecuária ilegal, libera carbono em escala que compromete não apenas o Brasil, mas a estabilidade climática global.",rep1:[{...REP.ipcc_clima,dica:"O IPCC aponta a Amazônia como reguladora do clima global; sua destruição teria consequências catastróficas para o regime de chuvas da América do Sul."},{...REP.codigo_florestal,dica:"O Código Florestal obriga a preservação de áreas de reserva legal; use para mostrar que a legislação é clara, mas a fiscalização é insuficiente."}],arg2:"As comunidades indígenas e tradicionais que vivem na Amazônia são as guardiãs mais eficazes da floresta — dados mostram que terras indígenas têm muito menos desmatamento —, mas são as menos apoiadas pelo Estado.",rep2:[{...REP.fanon_condenados,dica:"Fanon mostra que quem vive em território valorizado é expulso por quem tem mais poder; comunidades amazônicas são pressionadas por interesses econômicos que o Estado deveria conter."},{...REP.onu_biodiversidade,dica:"O Acordo de Kunming-Montréal reconhece o papel dos povos indígenas na conservação; usar os indígenas como guardiãs é uma política ambiental eficaz e justa."}],intervencao:{agente:"O Governo Federal",detalhamento:"responsável constitucional pela conservação da Amazônia e pela fiscalização do desmatamento, com poder de decreto de áreas protegidas e acionamento das forças de segurança",acao:"deve zerar o desmatamento ilegal na Amazônia até 2030, ampliar as terras indígenas demarcadas e criar política de bioeconomia que remunere as comunidades que preservam a floresta",modo:"por meio de monitoramento por satélite em tempo real, operações de fiscalização e criação de mercado de crédito de carbono regulado",efeito:"preservando a Amazônia para as futuras gerações e posicionando o Brasil como líder mundial em conservação ambiental"}}},
{id:27,titulo:"Desafios para garantir a segurança alimentar no Brasil",eixo:1,prob:"MEDIA_ALTA",fontes:["Abimael Ferreira","Elias Ancelmo"],evidencias:"O Brasil saiu do Mapa da Fome da ONU em 2023, mas 33 milhões de pessoas ainda passam fome (Rede PENSSAN, 2024). O Brasil é o maior exportador agrícola do mundo, paradoxo que exige explicação.",esquema:{rep_intro:[{...REP.lula_fome,dica:"A FAO reconheceu a saída do Brasil do Mapa da Fome como avanço; use para mostrar que a tendência é positiva, mas os números absolutos ainda são inaceitáveis."},{...REP.ibge_desigualdade,dica:"Dados da PNAD sobre insegurança alimentar mostram a concentração da fome entre negros, mulheres chefes de família e moradores do Norte e Nordeste."}],arg1:"O paradoxo brasileiro — maior exportador agrícola do mundo e ainda com milhões com fome — revela que a produção em si não garante o acesso, e que distribuição e renda são as variáveis críticas.",rep1:[{texto:"EMBRAPA/MAPA — Anuário da Agricultura Brasileira (2023): concentração e modelo de produção",tipo:"Dado/Pesquisa",dica:"Piketty mostra que mercados desregulados concentram riqueza; o agronegócio gera riqueza que não chega à mesa dos mais pobres sem políticas redistributivas."},{...REP.fanon_condenados,dica:"Fanon mostra a contradição entre produção colonial de alimentos para exportação e fome local; o agro-exportador brasileiro repete esse padrão."}],arg2:"A insegurança alimentar compromete o desenvolvimento cognitivo de crianças, a produtividade de adultos e agrava as desigualdades, tornando-se ao mesmo tempo causa e consequência da pobreza.",rep2:[{...REP.freire_pedagogia,dica:"Freire não separava fome e educação: uma criança com fome não aprende. A segurança alimentar é pré-condição para qualquer política educacional."},{...REP.mbembe_necro,dica:"A morte por fome num país que expórta alimentos é uma forma de necropolítica: o Estado escolhe a quem garantir a vida."}],intervencao:{agente:"O Governo Federal",detalhamento:"responsável pela coordenação do Sistema Nacional de Segurança Alimentar e Nutricional e pelo financiamento do Programa Nacional de Alimentação Escolar",acao:"deve ampliar o Programa de Aquisição de Alimentos, fortalecer o Programa Nacional de Alimentação Escolar e regular o mercado para garantir que a produção nacional atenda prioritariamente o consumo interno",modo:"por meio de compras instísitucionais da agricultura familiar, rede de restaurantes populares e política de estoques reguladores de alimentos básicos",efeito:"garantindo que todo brasileiro, independentemente de onde vive ou de quanto ganha, tenha acesso a alimentos suficientes e nutritivos"}}},
{id:28,titulo:"Desafios para garantir a equidade racial na educação brasileira",eixo:2,prob:"MEDIA_ALTA",fontes:["Slides Eixo 2","Profinho"],evidencias:"Estudantes negros têm menor acesso ao ensino superior e maior evasão escolar (IBGE, 2023). A Lei de Cotas (2012) completou 10 anos com avanços reconhecidos mas desigualdades persistentes. O PNE 2026 inclui metas raciais.",esquema:{rep_intro:[{...REP.fanon_condenados,dica:"Fanon mostra que o colonialismo reserva para grupos racializados um lugar subalterno nos sistemas sociais, incluindo a educação; a desigualdade racial na escola é herança estrutural, não deficit individual."},{...REP.ibge_desigualdade,dica:"Dados sobre escolaridade, evasão e acesso ao ensino superior por cor/raça mostram que o Brasil tem dois sistemas educacionais — um para brancos e outro para negros."}],arg1:"A baixa representação de professores negros nas escolas e a ausência de referências históricas e culturais afro-brasileiras no currículo contribuem para a invisibilidade que desincentiva a permanência escolar de estudantes negros.",rep1:[{...REP.mbembe_necro,dica:"Mbembe mostra que a invisibilização de grupos racializados nos espaços de poder é uma forma de morte social; aplique ao currículo escolar que apaga a contribuição negra."},{...REP.freire_pedagogia,dica:"Freire defende a educação que parte da realidade do educando; uma escola que não reconhece a cultura negra não reconhece a realidade de metade da população brasileira."}],arg2:"As cotas raciais nas universidades foram um avanço significativo, mas a desigualdade começa antes, na educação básica, onde as escolas públicas — mais frequentadas por negros — têm piores indicadores de qualidade.",rep2:[{texto:"IBGE/PNAD Contínua 2023 — desigualdade de acesso à educação por renda e cor/raça",tipo:"Dado/Pesquisa",dica:"Piketty mostra que desigualdade de educação perpetua desigualdade de renda; as cotas são necessárias mas insuficientes sem intervenção na base do funil educacional."},{...REP.pne_2026,dica:"O PNE 2026 inclui metas raciais; use para mostrar que o compromisso existe, mas a execução ainda está muito aquem do necessário."}],intervencao:{agente:"O Ministério da Educação e o Ministério da Igualdade Racial",detalhamento:"responsável pelas diretrizes da Base Nacional Curricular Comum e pelo financiamento de programas de combate à desigualdade racial nas escolas públicas",acao:"devem implementar a Lei 10.639/2003 de forma integral em todo o currículo, criar programas de incentivo à formação de professores negros e ampliar programas de permanência para estudantes negros nas universidades",modo:"por meio de monitoramento de indicadores raciais por escola, formação antirracista de docentes e produção de material didático que represente a diversidade racial brasileira",efeito:"reduzindo as desigualdades raciais na educação e construindo uma escola que reflita e celebre a diversidade do povo brasileiro"}}},
{id:29,titulo:"Os desafios do discurso de ódio nas redes sociais para a democracia brasileira",eixo:4,prob:"MEDIA_ALTA",fontes:["Slides Eixo 4","SAE simulados"],evidencias:"O Brasil registrou aumento de 200% em conteúdo de ódio on-line entre 2020 e 2023 (SaferNet). O TSE adotou medidas de combate à desinformação nas eleições de 2022 e 2024. O ataques de 8 de janeiro foram articulados em redes sociais.",esquema:{rep_intro:[{texto:"Agência Lupa/AosFatos — Relatório de Checagem 2023: desinformação em redes sociais",tipo:"Dado/Pesquisa",dica:"Chomsky mostra como discursos se fabricam e se propagam; nas redes sociais, esse processo é descentralizado e exponencial, tornando o discurso de ódio mais difícil de combater."},{texto:"STF — ADO 26 (2019): criminalização da homofobia como proteção de minorias em democracia",tipo:"Jurídico/Normativo",dica:"Tocqueville identificou o risco da tirania da maioria nas democracias; o discurso de ódio digital é uma forma contemporânea dessa tirania que silencia minorias."}],arg1:"Os algoritmos das plataformas digitais, ao priorizar conteúdo que gera mais reações emocionais, amplificam o discurso de ódio e o transformam em norma, gerando o que estudiosos chamam de 'normalização do extremismo'.",rep1:[{texto:"UNESCO — Convenção sobre Diversidade das Expressões Culturais (2005)",tipo:"Jurídico/Normativo",dica:"Bauman mostra que a modernidade líquida fragiliza vínculos sociais e identidades; o discurso de ódio prospera nesse ambiente de incerteza, oferecendo 'inimigos' como explicação para as frustrações."},{texto:"Racionais MC's — Sobrevivendo no Inferno (1997)",tipo:"Cultural/Música",dica:"Em Sobrevivendo no Inferno, os Racionais MC's já documentavam o discurso que criminaliza o negro antes mesmo da era das redes sociais; a letra mostra que o ódio digitalizado de hoje tem raízes históricas profundas que o Estado precisa enfrentar.dos."}],arg2:"A imunidade legal das plataformas pelo conteúdo publicado por terceiros — prevista no Marco Civil
