 da Internet — desincentiva a moderação proativa e torna a responsabilização jurídica ineficaz.",rep2:[{...REP.lgpd,dica:"A LGPD é um passo importante na regulação digital, mas não aborda o conteúdo em si; mostre que o Brasil precisa de uma nova camada regulatória para moderar conteúdo de ódio."},{...REP.freire_pedagogia,dica:"Freire defende o diálogo como fundamento da democracia; o discurso de ódio digital é a negação do diálogo e, portanto, um ataque à democracia em sua essência."}],intervencao:{agente:"O Congresso Nacional e o STF",detalhamento:"detentor da competência de criar marcos legais e responsável por garantir que a liberdade de expressão digital não se converta em impunidade para a disseminação do ódio",acao:"devem atualizar o Marco Civil da Internet para incluir responsabilidade das plataformas por conteúdo de ódio, criar órgão regulador de conteúdo digital e exigir transparência algoritmica das big techs",modo:"por meio de legislação específica, multas progressivas e mecanismos de denúncia acessíveis à população",efeito:"protegendo a democracia brasileira do discurso de ódio e garantindo que as redes sociais sejam um espaço de diálogo, não de violência"}}},
{id:30,titulo:"Desafios para a proteção de dados pessoais no Brasil",eixo:5,prob:"MEDIA_ALTA",fontes:["Slides Eixo 5"],evidencias:"Em 2023, o CPF de todos os brasileiros foi exposto em megavazamentos. A LGPD (2018) foi um marco, mas a ANPD ainda não tem autonomia plena. O Brasil é o 2º país com mais usuvários afetados por vazamentos no mundo.",esquema:{rep_intro:[{...REP.lgpd,dica:"A LGPD é o marco jurídico central; use para mostrar que o Brasil dá um passo importante, mas a lei não é suficiente sem uma autoridade reguladora forte e independente."},{texto:"ANPD — Relatório de Fiscalização 2023: violações à LGPD e mercado de dados",tipo:"Jurídico/Normativo",dica:"Harari mostra que dados pessoais são o ativo mais valioso do século XXI; quem controla os dados, controla a narrativa — e potencialmente a vida das pessoas."}],arg1:"A coleta indiscriminada de dados por empresas de tecnologia, aliada a sistemas de segurança insuficientes, cria vulnerabilidades que expõem cidadãos a golpes, fraudes e discriminação algorítmica.",rep1:[{texto:"ANPD — Relatório de Fiscalização 2023: principais violações à LGPD no Brasil",tipo:"Jurídico/Normativo",dica:"Bauman já falava em 'sociedade de vigilância'; o vazamento de dados é a concretização do risco que ele previu, com o agravante de que a vigilância se tornou privada e lucrativa."},{texto:"ANPD — Relatório de Fiscalização 2023: empresas que comercializam dados sem autorização",tipo:"Jurídico/Normativo",dica:"Chomsky mostra como o controle da informação dá poder; empresas que acumulam dados pessoais acumulam poder de influência que pode superar o do próprio Estado."}],arg2:"A ausência de educação digital sobre privacidade deixa os cidadãos — especialmente os mais velhos e os de menor escolaridade — despreparados para proteger seus próprios dados.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a leitura crítica do mundo; a educação sobre privacidade digital é a forma mais prática de empoderar os cidadãos no ambiente digital."},{...REP.onu_crianca,dica:"A ONU reconhece a privacidade como direito da criança; a proteção de dados de menores exige regras ainda mais estritas."}],intervencao:{agente:"A ANPD — Autoridade Nacional de Proteção de Dados",detalhamento:"órgão federal com atribuição legal de fiscalizar o cumprimento da LGPD, aplicar sanções às empresas e orientar cidadãos sobre seus direitos em relação ao uso de dados pessoais",acao:"deve fiscalizar ativamente o cumprimento da LGPD, aplicar multas significativas por vazamentos e descumprimentos e criar programa de educação digital sobre privacidade nas escolas",modo:"por meio de notificações obrigatórias de vazamento, certificação de segurança para empresas e campanha nacional de consciêntização sobre privacidade digital",efeito:"garantindo que todo brasileiro tenha controle sobre seus dados pessoais e confiança para usar os serviços digitais com segurança"}}},
{id:31,titulo:"Desafios para a promoção da diversidade de gênero no Brasil",eixo:1,prob:"MEDIA",fontes:["Slides Eixo 1"],evidencias:"Levantamento do STF (2024) mostra crescimento de 30% em processos sobre discriminação de gênero. O Brasil é o país que mais mata pessoas trans no mundo (TGEU, 2023). A Resolução 175 do CNJ garantiu união civil entre pessoas do mesmo sexo.",esquema:{rep_intro:[{...REP.mbembe_necro,dica:"A necropolítica explica por que o Brasil mata tantas pessoas trans: é o Estado que decide, implicitamente, quem merece viver. Use para mostrar que os assassinatos não são isolados: são sistema."},{texto:"STF — ADO 26 (2019): criminalização da homofobia como proteção de minorias em democracia",tipo:"Jurídico/Normativo",dica:"Tocqueville mostrou que democracia exige proteção das minorias contra a tirania da maioria; a perseguição de pessoas LGBTQIA+ é a negação desse princípio."}],arg1:"A ausência de legislação específica de proteção contra a discriminação de gênero — suprida parcialmente por decisão judicial — deixa a proteção de pessoas LGBTQIA+ vulnerável a reversões políticas.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra como a identidade colonizada é reprimida; pessoas trans e não-binárias são vistas como ameaças pela norma binária de gênero que o patriarcado impõe."},{...REP.ibge_desigualdade,dica:"Dados sobre mercado de trabalho e condições de vida de pessoas LGBTQIA+ mostram exclusão estrutural que vai da escola ao mercado."}],arg2:"A falta de educação para a diversidade nas escolas alimenta o preconceito e a violência, criando ambientes hostis que afastam estudantes LGBTQIA+ e comprometem seu desenvolvimento.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende o reconhecimento do outro; a educação para a diversidade é a aplicação prática desse princípio, ensinando a reconhecer e respeitar o diferente."},{texto:"CETIC.br — TIC Crianças e Adolescentes 2023: violência online e cyberbullying entre jovens",tipo:"Dado/Pesquisa",dica:"Bauman mostra que identidades são fluidas na modernidade; mas a sociedade tende a reagir à fluidez com rigidez normativa e exclulsão."}],intervencao:{agente:"O Congresso Nacional",detalhamento:"detentor da competência legislativa de ampliar e regulamentar os direitos de grupos hisstoricamente discriminados, conferindo-lhes respaldo jurídico efetivo",acao:"deve aprovar legislação específica de combate à discriminação de gênero, criar programa de educação para a diversidade nas escolas e garantir políticas de saúde e emprego para pessoas trans",modo:"por meio de lei anti-discriminação, cursos de formação docente sobre diversidade de gênero e cota de inclusão de pessoas trans no serviço público",efeito:"construindo um país em que todas as pessoas, independentemente de gênero e sexualidade, possam viver com dignidade, segurança e igualdade de direitos"}}},
{id:32,titulo:"Os desafios da adultização de crianças nas redes sociais",eixo:5,prob:"MEDIA",fontes:["Slides Eixo 5"],evidencias:"Pesquisa do UNICEF (2023) aponta que 70% das crianças com 10 anos já usam redes sociais. A exposição precoce a conteúdos adultos acelera o desenvolvimento psicossexual e gera ansiedade. O ECA Digital (2024) abordou parcialmente o problema.",esquema:{rep_intro:[{...REP.eca_digital,dica:"A lei representa uma resposta do Estado; use-a para mostrar que há reconhecimento do problema, mas que a aplicação e a responsabilização das plataformas ainda são incipientes."},{...REP.onu_crianca,dica:"A Convenção garante à criança o direito de ser criança, em seu próprio ritmo de desenvolvimento; as redes a empurram para um universo adulto para o qual ela não está pronta."}],arg1:"O acesso irrestrito de crianças a conteúdos de beleza, sexualidade e consumo voltados para adultos gera pressões de performance que comprometem a autoestima, a imagem corporal e o desenvolvimento psicológico.",rep1:[{...REP.byung_chul,dica:"Han mostra que a sociedade do desempenho cria exigências de performance que adoecem adultos; quando aplicadas a crianças — exigências de beleza, produtividade, engajamento —, os efeitos são ainda mais devastadores."},{texto:"CONAR/ANDI — Relatório sobre Publicidade Infantil Digital (2023)",tipo:"Dado/Pesquisa",dica:"Bauman mostra que o consumo é a lógica dominante da modernidade líquida; as crianças nas redes são alvo prioritário da indústria de consumo que se aproveita de sua vulnerabilidade."}],arg2:"A ausência de mediação parental e de controles técnicos eficazes deixa as crianças expostas sem proteção, enquanto as plataformas maximizam o tempo de tela porque crianças engajadas geram receita publicitária.",rep2:[{texto:"CETIC.br — TIC Crianças e Adolescentes 2023: exposição a conteúdo comercial e inadequado",tipo:"Dado/Pesquisa",dica:"Chomsky mostra que a mídia produz conteúdo para fins comerciais, não educativos; as plataformas digitais fazem o mesmo com crianças, monetizando sua atenção."},{...REP.freire_pedagogia,dica:"Freire defende a educação crítica; os pais e professores precisam ser formados para mediar o acesso das crianças às telas com leitura crítica."}],intervencao:{agente:"A ANATEL e o MEC",detalhamento:"responsável constitucional pela proteção integral de crianças e adolescentes e pelo estabelecimento de limites legais ao conteúdo direcionado ao público infantojuvenil",acao:"devem regulamentar a idade mínima de acesso a redes sociais, exigir controles parentais efícazes nas plataformas e incluir educação midiática no currículo infantil",modo:"por meio de legislação de proteção online de menores, multas às plataformas que não implementarem controles e campanhas de orientação familiar",efeito:"protegendo as crianças brasileiras da adultização precoce e garantindo que o ambiente digital seja adequado ao seu desenvolvimento"}}},
{id:33,titulo:"Perspectivas para o combate à violência de gênero no ambiente digital",eixo:4,prob:"MEDIA",fontes:["Renan Torres","Slides Eixo 4"],evidencias:"70% das mulheres brasileiras já sofreram assédio on-line (DataSenado, 2023). A prática de revenge porn cresceu 300% durante a pandemia. A Lei Carolina Dieckmann (2012) foi o primeiro passo legal, mas é insuficiente.",esquema:{rep_intro:[{...REP.feminicidio_lei,dica:"A lei do feminicídio reconhece a violência de gênero como crime; mostre que o ambiente digital criou novas formas dessa violência que a legislação ainda não acompanhou plenamente."},{...REP.mbembe_necro,dica:"A necropolítica não é apenas física; o apagamento digital de mulheres, o assédio e o revenge porn são formas de controle e humilhação que o poder masculino exerce sobre corpos femininos."}],arg1:"O assédio on-line, a divulgação não consentida de imagens íntimas e as campanhas de dilèsse organizado contra mulheres nas redes constituem novas formas de violência de gênero que afastam mulheres do espaço público digital.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra que o controle do corpo é uma forma de opressão; nas redes, a violência digital é usada para silenciar mulheres que ocupam espaços de poder, como jornalistas e políticas."},{...REP.ibge_desigualdade,dica:"Dados sobre violência contra a mulher mostram que a violência digital atinge desproporcionalmente mulheres negras e jovens; evidencia a interseccionalidade."}],arg2:"As plataformas digitais, ao processar lentamente denúncias de violência de gênero e ao não removerem conteúdos de forma ágil, tornam-se cúmplices da perpetuação dessa violência.",rep2:[{texto:"ANPD — Relatório sobre Monetização de Dados por Plataformas Digitais (2023)",tipo:"Jurídico/Normativo",dica:"Chomsky mostra que a mídia privilegia quem tem poder; as plataformas, cujo modelo de negócio depende de engajamento, lucram com conteúdo polêmico, inclusive com assédio."},{...REP.lgpd,dica:"A LGPD poderia ser usada para responsabilizar plataformas que não removem conteúdo violento prontamente; mostre que há instrumentos legais, mas a aplicação é insuficiente."}],intervencao:{agente:"O Congresso Nacional e o Ministério das Mulheres",detalhamento:"detentor da competência de criar legislação específica sobre violência digital de gênero e de exigir das plataformas mecanismos eficazes de denúncia e remoção de conteúdo",acao:"devem atualizar a legislação para criminalizar todas as formas de violência digital de gênero, criar canal de denúncia ágil e exigir resposta das plataformas em até 24 horas",modo:"por meio de legislação específica, multas disuasivas às plataformas e programa de acolhimento às vítimas com suporte psicológico e jurídico",efeito:"garantindo às mulheres o direito de ocupar o espaço digital com segurança e liberdade, sem medo de violência ou silenciamento"}}},
{id:34,titulo:"Os impactos da hiperconectividade na saúde mental",eixo:7,prob:"MEDIA",fontes:["acelerenoenem","Slides Eixo 7"],evidencias:"1 em cada 4 brasileiros tem algum transtorno de saúde mental (OMS, 2023). Casos de ansiedade em jovens subiram 40% pós-pandemia (Fiocruz). O Brasil é líder mundial em ansiedade entre jovens.",esquema:{rep_intro:[{...REP.byung_chul,dica:"Han é a referência central para hiperconectividade e saúde mental; o conceito de 'sociedade do cansamento' articula perfeitamente como a sobrecarga digital gera esgotamento e depressão."},{...REP.onu_saude_mental,dica:"O relatório da OMS (2022) sobre saúde mental global dá base científica internacional para o argumento; mostra que o problema é reconhecido como crise."}],arg1:"A constante conectividade e a pressão por responsividade imediata nas redes sociais eliminam o tempo de descanso cognitivo, criando um estado de alerta permanente que aumenta o cortisol e favorece transtornos de ansiedade.",rep1:[{texto:"Pesquisa TIC Domicílios (CGI.br, 2023) — comportamento digital e impacto psicossocial em jovens",tipo:"Dado/Pesquisa",dica:"Bauman mostra que as identidades se tornaram instáveis; nas redes, a necessidade de manter uma 'marca pessoal' atualizada gera esgotamento identitário."},{...REP.lei_celular,dica:"A lei de proibição de celulares nas escolas é uma resposta do Estado ao problema; use para mostrar que há reconhecimento do risco, mas a medida é pontual e insuficiente."}],arg2:"A ausência de práticas de desconexão e de limite de tempo de tela — tánto no nível individual quanto no político e corporativo — resulta em dependência digital que compromete o sono, a atenção e o bem-estar.",rep2:[{...REP.sus_saude_mental,dica:"O SUS tem obrigação de tratar transtornos mentais; o aumento de casos relacionados à hiperconectividade gera nova demanda que o sistema ainda não absorve adequadamente."},{...REP.freire_pedagogia,dica:"Freire defende a autonomia do educando; educar para o uso consciente das telas é uma forma de garantir autonomia em vez de dependência digital."}],intervencao:{agente:"O Ministério da Saúde e o Ministério da Educação",detalhamento:"órgãos federais responsáveis, respectivamente, pela política nacional de saúde mental e pela formação crítica dos estudantes quanto ao uso das tecnologias digitais",acao:"devem criar diretrizes nacionais de uso saudável de telas, incluir educação para a desconexão no currículo escolar e regulamentar o design aditivo de aplicativos voltados a adolescentes",modo:"por meio de campanha nacional de saúde digital, obrigatoriedade de alertas de tempo de uso e rede de atenção em saúde mental nas escolas",efeito:"reduzindo os impactos negativos da hiperconectividade na saúde mental dos brasileiros e promovendo uma relação mais equilibrada com a tecnologia"}}},
{id:35,titulo:"Perspectivas para a inclusão de pessoas autistas no Brasil",eixo:1,prob:"MEDIA",fontes:["Slides Eixo 1"],evidencias:"1 em cada 54 crianças tem autismo (CDC, 2020). No Brasil, estima-se 2 milhões de autistas (CFM). A Lei Berenice Piana (2012) é o marco legal, mas acesso a diagnóstico e tratamento é extremamente desigual.",esquema:{rep_intro:[{...REP.brasil_200,dica:"A LBI inclui pessoas autistas; use para mostrar que há arcabouço legal, mas a distância entre lei e realidade é enorme, especialmente para quem não tem acesso a serviços especializados."},{texto:"Lei Berenice Piana — Lei nº 12.764/2012",tipo:"Jurídico/Legal",dica:"A lei estabelece a Política Nacional de Proteção dos Direitos da Pessoa com Transtorno do Espectro Autista; use para mostrar que o Estado reconhece o problema, mas a implementação é desigual."}],arg1:"O atraso no diagnóstico de autismo — que no Brasil ocorre em média aos 7 anos, quando em países avançados ocorre antes dos 3 — priva crianças de intervenções precoces que fazem diferença no desenvolvimento.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre acesso a serviços de saúde por renda mostram que o diagnóstico precoce de autismo é privilégio das famílias mais ricas."},{...REP.freire_pedagogia,dica:"Freire defende que cada sujeito tem um modo próprio de conhecer; a escola inclusiva para autistas é a aplicação concreta desse princípio."}],arg2:"A inclusão escolar de autistas, sem formação docente adequada e sem apoio de professores auxiliares e terapeutas na escola, resulta em inclusão formal mas exclusão real.",rep2:[{texto:"INEP — Censo Escolar 2023: déficit de acessibilidade em escolas para estudantes com deficiência",tipo:"Dado/Pesquisa",dica:"Democracia exige igualdade de condições; uma escola que não tem condições de incluir um autista não é uma escola democrática."},{...REP.mbembe_necro,dica:"O Estado que não garante diagnóstico e inclusão de autistas decide implicitamente que esses cidadãos não têm lugar pleno na vida social."}],intervencao:{agente:"O Ministério da Saúde e o MEC",detalhamento:"responsável pela implementação da Lei Berenice Piana e pelo financiamento das políticas de inclusão escolar e de atenção à saúde das pessoas com Transtorno do Espectro Autista",acao:"devem ampliar a oferta de diagnóstico precoce pelo SUS, criar programa de formação de professores para inclusão de autistas e garantir professor auxiliar para todos os estudantes autistas na escola pública",modo:"por meio de centros de referência mão-de-obra em autismo, concursos específicos para professores auxiliares e parceria com universidades para formação continuada",efeito:"garantindo às pessoas autistas o direito ao diagnóstico precoce, à educação de qualidade e à inclusão plena na sociedade brasileira"}}},
{id:36,titulo:"Perspectivas para a valorização da diversidade cultural no Brasil",eixo:3,prob:"MEDIA",fontes:["Slides Eixo 3"],evidencias:"O Brasil tem 305 povos indígenas, população afro-brasileira de mais de 56% e múltiplas diásporas. A Convenção da UNESCO sobre Diversidade Cultural (2005) foi ratificada pelo Brasil. O financiamento cultural é historicamente concentrado no Sudeste.",esquema:{rep_intro:[{texto:"Chico Buarque — Construção (1971)",tipo:"Cultural/Música",dica:"Construção, de Chico Buarque (1971), celebra a linguagem popular e as vozes anônimas que constroem o Brasil; a canção afirma que a cultura nacional se faz com pluralidade e dignidade, não com uniformidade.um arquivo vivo que precisa de proteção."},{texto:"Convenção sobre a Proteção e Promoção da Diversidade das Expressões Culturais — UNESCO (2005)",tipo:"Internacional/ONU",dica:"A Convenção reconhece a diversidade cultural como patrimônio da humanidade; use para dar suporte internacional à argumento."}],arg1:"A concentração do financiamento cultural nas metrópoles do Sudeste apaga manifestações das regiões Norte, Nordeste e Centro-Oeste e dos grupos afro-brasileiros e indígenas, empobrecendo a cultura nacional.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre distribuição de equipamentos e investimentos culturais por região mostram a concentração e a exclusão cultural das regiões menos desenvolvidas."},{...REP.fanon_condenados,dica:"Fanon mostra que o colonialismo hierarquiza culturas; o Sudeste como 'centro cultural' do Brasil repete esse padrão, subvalorizando as culturas periféricas."}],arg2:"A globalização cultural e a hiper-presença das indústrias culturais dos países centrais nas plataformas digitais ameaça a sobrevivência de culturas locais e a identidade das gerações mais jovens.",rep2:[{texto:"UNESCO — Convenção sobre Diversidade das Expressões Culturais (2005)",tipo:"Jurídico/Normativo",dica:"Bauman mostra que as identidades se fragilizaram na modernidade líquida; a homogeneização cultural das plataformas acelera esse processo, criando jovens desconectados de suas raízes."},{texto:"UNESCO — Relatório Mundial da Cultura 2022: diversidade cultural ameaçada por hegemonias digitais",tipo:"Dado/Pesquisa",dica:"Chomsky mostra que a mídia molda a percepção do que é legítimo e valioso; plataformas globais que não valorizam culturas locais são um veículo de imposição cultural."}],intervencao:{agente:"O Ministério da Cultura",detalhamento:"controlador dos recursos do Fundo Nacional de Cultura e responsável por induzir políticas de fomento à diversidade cultural nas diferentes regiões do país",acao:"deve redistribuir o financiamento cultural para as regiões Norte, Nordeste e Centro-Oeste, criar programa de apoio a manifestações afro-brasileiras e indígenas e incluir diversidade cultural no currículo escolar",modo:"por meio de critérios regionais e populacionais na distribuição do Fundo Nacional de Cultura, linhas de financiamento específicas para grupos sub-representados e plataformas digitais de cultura brasileira",efeito:"garantindo que a riqueza cultural brasileira seja valorizada, preservada e transmitida às gerações futuras em toda a sua diversidade"}}},
{id:37,titulo:"Perspectivas para a regularização do trabalho informal no Brasil",eixo:8,prob:"MEDIA",fontes:["Slides Eixo 8"],evidencias:"40% dos trabalhadores brasileiros são informais (IBGE/PNAD, 2023). A informalidade concentra-se entre negros, mulheres e trabalhadores sem ensino médio. A UNIND tentou reduzir informalidade em plataformas.",esquema:{rep_intro:[{...REP.ibge_desigualdade,dica:"Dados da PNAD sobre informalidade mostram a concentração em grupos vulnerabilizados; dão concretude ao argumento da dimensão social e racial do problema."},{texto:"IBGE — PNAD Contínua 2024: 38 milhões de trabalhadores informais e ausência de proteção social",tipo:"Dado/Pesquisa",dica:"Piketty mostra que o mercado de trabalho informal é o lado oculto do capitalismo que concentra capital: quem é informal perde acesso à previdência, ao FGTS e à justiça do trabalho."}],arg1:"A informalidade não é apenas uma questão trabalhista, mas um mecanismo de exclusão social: trabalhadores informais não acessam FGTS, previdência, licença-maternidade nem seguro-desemprego, ficando desprotegidos nos momentos de maior vulnerabilidade.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra que os condenados da terra são os que ficam fora dos mecanismos formais de proteção; no Brasil, os trabalhadores informais são os mais expostoõ e os menos protegidos."},{...REP.mbembe_necro,dica:"A informalidade mata: trabalhadores sem INSS não se aposentam com dignidade e ficam expostos à pobreza na terceira idade."}],arg2:"A persistência da informalidade é alimentada por uma cultura empresarial que prefere a subcontratação ao vínculo formal e por um sistema tributário que penaliza a legalização de pequenos negócios.",rep2:[{texto:"IBGE — PNAD Contínua 2024: condições de trabalho e ausência de proteção na informalidade",tipo:"Dado/Pesquisa",dica:"Chomsky mostra que o poder corporativo fabrica narrativas; a narrativa de que a informalidade é 'escolha' dos trabalhadores mascara que ela é imposta por uma estrutura que os exclúi do mercado formal."},{texto:"DIEESE — Nota Técnica \"Trabalho por Plataformas Digitais\" (2023)",tipo:"Dado/Pesquisa",dica:"Toffler previu a fragmentação do trabalho na era digital; a informalidade é um produto estrutural dessa fragmentação, exigindo novas formas de proteção social."}],intervencao:{agente:"O Ministério do Trabalho e Emprego",detalhamento:"detentor da competência de regulamentar as relações de trabalho, estender direitos trabalhistas e criar políticas de formação e proteção dos trabalhadores informais",acao:"deve simplificar a formalização de trabalhadores autônomos, reduzir encargos para micro e pequenas empresas e criar contribuição previdenciária flexível para informais",modo:"por meio de plataforma digital de formalização simplificada, redução de impostos na faixa informal-formal e ampliação do Simples Nacional",efeito:"reduzindo a informalidade e garantindo que mais trabalhadores tenham acesso à proteção social que o vínculo formal oferece"}}},
{id:38,titulo:"Perspectivas para a responsabilidade socioambiental das empresas no Brasil",eixo:6,prob:"MEDIA",fontes:["Slides Eixo 6"],evidencias:"O Brasil é signatário dos Objetivos de Desenvolvimento Sustentável da ONU. O desastre de Mariana (2015) e Brumadinho (2019) revelaram o risco ambiental das grandes corpóes. A COP30 em Belém (2025) coloca o Brasil no centro do debate.",esquema:{rep_intro:[{...REP.paris_clima,dica:"O Acordo de Paris compromete governos, mas o setor privado é responsável por 71% das emissões; use para mostrar que a responsabilidade corporativa não é opção voluntária, mas imperativo climático."},{...REP.ipcc_clima,dica:"O IPCC mostra que o tempo para mudanças é curto; use para urgentizar a pauta da responsabilidade empresarial."}],arg1:"Os desastres ambientais de Mariana e Brumadinho revelaram que a auto-regulação do setor privado em questões ambientais é ineficaz: sem fiscalização rigorosa, as empresas priorizam o lucro sobre a segurança.",rep1:[{texto:"FIOCRUZ — \"Saúde do Trabalhador\" (2023): adoecimento entre trabalhadores de setores sem regulação ambiental",tipo:"Dado/Pesquisa",dica:"Piketty mostra que o capitalismo tende a externalizar custos e internalizar lucros; a poluíção ambiental é um custo externalizado para a sociedade e para o planeta."},{...REP.ibge_desigualdade,dica:"Dados sobre localização de desastres ambientais mostram que as comunidades afetadas são invariavelmente as mais pobres e negras; é a dimensão social do risco ambiental."}],arg2:"A agenda ESG — ambiental, social e de governança — precisa sair do discurso e se tornar obrigação legal, com metas mensuráveis, auditoria independente e responsabilização efetiva de gestores.",rep2:[{...REP.amazonia_constituicao,dica:"O Art. 225 § 3º da CF prevê responsabilização de pessoas jurídicas por danos ambientais; use para mostrar que há base constitucional para a responsabilização, mas a aplicação é lenta."},{...REP.codigo_florestal,dica:"O Código Florestal obriga a preservação de áreas de reserva legal; use para mostrar que existe legislação, mas que as empresas precisam de regras mais rígidas."}],intervencao:{agente:"O Ibama e a Comissão de Valores Mobiliários",detalhamento:"detentor da competência de regulamentar as atividades empresariais, estabelecer obrigações socioambientais e fiscalizar o cumprimento das normas de responsabilidade corporativa",acao:"devem tornar a divulgação de relatórios de impacto ambiental obrigatória, criar metas setoriais de redução de emissões e responsabilizar gestores por danos ambientais de suas empresas",modo:"por meio de legislação de reporting ambiental, auditoria externa independente e mercado de crédito de carbono regulado",efeito:"estimulando a iniciaítiva privada a adotar práticas sustentáveis e contribuindo para que o Brasil cumpra seus compromissos climáticos internacionais"}}},
{id:39,titulo:"Perspectivas para a preservação do patrimônio cultural afro-brasileiro",eixo:3,prob:"MEDIA",fontes:["Slides Eixo 3"],evidencias:"O Candomblé e a Capoeira foram registrados como patrimônios imateriais pelo IPHAN. Terreiros de Candomblé sofrem ataques religosos crescentes. O patrimônio afro-brasileiro é cronicamente subfinanciado.",esquema:{rep_intro:[{...REP.fanon_condenados,dica:"Fanon mostra que o colonialismo destroi as culturas dos povos dominados; os ataques a terreiros e à cultura afro-brasileira são continuação desse processo de apagamento cultural."},{...REP.mbembe_necro,dica:"O apagamento cultural é uma forma de morte simbólica; destruir um terreiro ou proibir práticas culturais afro-brasileiras é exercer necropolítica sobre a identidade de um povo."}],arg1:"A intolerância religiosa e o vandalismo a espaços de prática da cultura afro-brasileira revelam a persistência do racismo estrutural e a fragilidade dos mecanismos de proteção do Estado.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre crimes de intolerância religiosa mostram concentração contra religiões de matriz africana; evidencia o caráter estrutural e racista do problema."},{texto:"IPHAN — Registro dos Terreiros de Candomblé como Patrimônio Cultural Imaterial (2018)",tipo:"Jurídico/Normativo",dica:"Benjamin mostra que obras culturais são objetos de memória; destruir um terreiro é destruir um arquivo vivo de saberes e práticas de uma cultura secular."}],arg2:"O currículo escolar, ao tratar a cultura afro-brasileira de forma marginal e episódica, apesar da Lei 10.639/2003, perpetua a invisibilidade que alimenta o preconceito e a intolerância.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a educação que parte da realidade do educando; para estudantes negros, ver sua cultura reconhecida na escola é uma experiência de pertencimento que a escola brasileira ainda não garante."},{texto:"IPHAN — Registro de expressões culturais afro-brasileiras como Patrimônio Imaterial",tipo:"Jurídico/Normativo",dica:"Democracia exige proteção das minorias; uma democracia que não protege a cultura de 56% de sua população é uma democracia inconclusa."}],intervencao:{agente:"O Ministério da Cultura e o Ministério da Igualdade Racial",detalhamento:"guardião do patrimônio cultural nacional, com obrigação constitucional de proteger as manifestações afro-brasileiras como bens culturais imateriais de toda a sociedade",acao:"devem ampliar o financiamento para preservação de terreiros e espaços culturais afro-brasileiros, criar programa de educação para a diversidade religiosa nas escolas e garantir investigação rigorosa dos crimes de intolerância",modo:"por meio de tombamento e registro de mais espaços culturais afro-brasileiros, fundo específico de preservação e implementação efetiva da Lei 10.639/2003",efeito:"garantindo que a cultura afro-brasileira seja valorizada, protegida e transmitida às gerações futuras, enriquecendo a identidade cultural de todo o país"}}},
{id:40,titulo:"Perspectivas para a superação do modelo manicomial na saúde mental brasileira",eixo:7,prob:"MEDIA",fontes:["Slides Eixo 7"],evidencias:"A Lei da Reforma Psiquíiátrica (2001) completou mais de 20 anos, mas o Brasil ainda tem 200 hospitais psiquiátricos ativos. A rede de CAPS é insuficiente: apenas 1/3 dos municípios têm um. Retrocesso manicomialista observado em 2022-2023.",esquema:{rep_intro:[{...REP.sus_saude_mental,dica:"A Lei 10.216 é o marco da desinstitucionalização; use para mostrar que o Brasil tem legislação progressista, mas a prática ainda oscila entre o modelo comunitário e o manicomialismo."},{...REP.onu_saude_mental,dica:"A OMS recomenda a substituição de hospitais psiquiátricos por serviços comunitários; cite para mostrar que o modelo de reforma psiquíiátrica é o padrão global recomendado."}],arg1:"O modelo manicomial — que ainda persiste no Brasil — viola direitos humanos fundamentais ao tratar o sofrimento mental como problema de ordem pública e não como questão de saúde com garantias de dignidade.",rep1:[{...REP.mbembe_necro,dica:"O manicômio é uma das instituições mais paradigmáticas da necropolítica: o Estado decide quem pode circular livremente e quem deve ser confinado."},{...REP.fanon_condenados,dica:"Fanon analisou a psicanálise como instrumento do colonialismo; aplique à psiquiatria manicomialista que classifica o sofrimento dos oprimidos como patologia individual, ignorando as causas sociais."}],arg2:"A rede de CAPS e serviços comunitários de saúde mental, proposta como alternativa ao manicômio, é cronicamente subfinanciada e desigualmente distribuída, deixando a desinstitucionalização incompleta.",rep2:[{...REP.ibge_desigualdade,dica:"Dados sobre disponibilidade de CAPS por município mostram a concentração nas grandes cidades e a ausência em municípios pequenos e médios."},{texto:"IBGE — Atlas do Desenvolvimento Humano 2023: distribuição de equipamentos públicos por municípios",tipo:"Dado/Pesquisa",dica:"Piketty mostra que os serviços públicos tendem a se concentrar onde já há mais recursos; o investimento em CAPS é menor justamente onde a necessidade é maior."}],intervencao:{agente:"O Ministério da Saúde",detalhamento:"responsável pela coordenação da política nacional de saúde mental e pelo financiamento da rede de atenção psicossocial substitutiva ao modelo manicomial",acao:"deve ampliar a rede de CAPS em todos os municípios com mais de 20 mil habitantes, criar prograçamas de moradias assistidas e proibir a criação de novos leitos em hospitais psiquiátricos",modo:"por meio de financiamento federal condicionado à implantação de CAPS, formáação de trabalhadores de saúde mental e programa nacional de moradias assistidas",efeito:"garantindo a todos os brasileiros com transtornos mentais o direito ao tratamento comunitário com dignidade e autonomia, superando definitivamente o modelo manicomialista"}}},
// Temas 41-60
{id:41,titulo:"Estratégias para combater a nomofobia na sociedade brasileira",eixo:7,prob:"MEDIA",fontes:["Bella Nazar","Aprova Total"],evidencias:"Pesquisas mostram que 90% dos jovens sentem ansiedade ao ficar sem celular; depressão associada ao uso excessivo de smartphones; Brasil no top 5 de países com maior uso de internet; Lei do Celular nas escolas como resposta.",esquema:{rep_intro:[{...REP.byung_chul,dica:"Byung-Chul Han é o autor mais preciso para nomofobia: a sociedade do cansaço que ele descreve é produto exatamente dessa hiperestimulação digital que impede o repouso e o pensamento profundo."},{...REP.onu_saude_mental,dica:"Dados da OMS sobre saúde mental digital e o impacto da dependência de smartphones nos jovens; dão base científica internacional ao argumento."}],arg1:"A nomofobia não é fraqueza individual, mas resultado de um design deliberado: as plataformas digitais usam técnicas de psicologia comportamental — notificações, likes, scroll infinito — para criar dependência e maximizar o tempo de uso.",rep1:[{texto:"CETIC.br — TIC Crianças e Adolescentes 2023: violência online e cyberbullying entre jovens",tipo:"Dado/Pesquisa",dica:"A liquidez de Bauman: as relações digitais são fluidas e escorregadias; o medo de perder uma mensagem reflete o medo de perder conexões num mundo onde tudo é passável."},{...REP.lei_celular,dica:"A Lei do Celular nas escolas é uma resposta parcial ao problema; use para argumentar que é necessária uma política mais ampla de educação digital."}],arg2:"A ausência de educação digital nas escolas deixa jovens desarmados diante de plataformas projetadas para capturar sua atenção: sem letramento crítico, não há consciência sobre os mecanismos de dependência.",rep2:[{...REP.freire_pedagogia,dica:"Freire defende a autonomia do educando; a educação para o uso crítico da tecnologia é a forma mais concreta de garantir essa autonomia no mundo digital."}],intervencao:{agente:"O governo federal em parceria com as plataformas digitais",detalhamento:"poder público com capacidade regulatória e empresas de tecnologia que controlam os algoritmos",acao:"deve regulamentar o uso de técnicas de design persuasivo que causam dependência digital e criar programa de educação para o uso saudável de telas nas escolas",modo:"por meio de padrões mínimos de bem-estar digital obrigatórios para plataformas que operam no país e inclusão de letramento digital no currículo",efeito:"reduzindo a dependência digital e promovendo um uso mais saudável e consciente da tecnologia"}}},
{id:42,titulo:"Caminhos para a valorização da literatura de cordel no Brasil",eixo:3,prob:"MEDIA",fontes:["Abimael Ferreira","Aprova Total"],evidencias:"Literatura de cordel registrada como patrimônio imaterial pelo IPHAN (2018); folhetos vendem cada vez menos; poucos autores jovens; cordel ainda ausente na maioria dos currículos escolares.",esquema:{rep_intro:[{...REP.freire_pedagogia,dica:"Freire valoriza os saberes populares; o cordel é uma forma de leitura do mundo que vem de baixo; use para defender sua inclusão no currículo como validação da cultura popular."},{texto:"IPHAN — Registro da Literatura de Cordel como Patrimônio Imaterial Brasileiro (2018)",tipo:"Jurídico/Normativo",dica:"Benjamin defende que toda arte tem função política; o cordel, como arte que nasce das margens, carrega essa função de forma especialmente evidente."}],arg1:"A literatura de cordel é resistência histórica: nasceu como voz dos marginalizados do Nordeste, narrou a seca, a injustiça e a fé quando os grandes meios de comunicação ignoravam essas realidades. Sua desvalorização é também apagamento histórico.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra como o colonialismo hierarquiza culturas; o cordel, manifestação do povo nordestino, é desvalorizado pela lógica que coloca a cultura letrada eurocentíca acima das produções populares."}],arg2:"A digitalização pode ser aliada do cordel: poetas cordelistas que usam redes sociais têm alcançado novos públicos, mas sem políticas de apoio, a tradição manual e a linguagem original do cordel podem se perder.",rep2:[{texto:"IPHAN — Registro da Literatura de Cordel como Patrimônio Imaterial Brasileiro (2018)",tipo:"Jurídico/Normativo",dica:"Toffler previu a era da produção cultural descentralizada; o cordel digital para públicos específicos pode ser uma forma de sobrevivência da manifestação cultural."},{...REP.ibge_desigualdade,dica:"Dados sobre acesso à cultura e distribuição geográfica de manifestações culturais mostram o quanto a cultura nordestina é sub-representada no financiamento nacional."}],intervencao:{agente:"O Ministério da Educação em parceria com o IPHAN",detalhamento:"órgãos com responsabilidade sobre educação e patrimônio imaterial",acao:"deve incluir a literatura de cordel como conteúdo obrigatório na educação básica e criar programa de apoio a poetas cordelistas",modo:"com capacitação de professores, distribuição de acervos nas escolas públicas e plataforma digital de cordel gratuita",efeito:"garantindo a transmissão dessa tradição às novas gerações e o reconhecimento de sua importância cultural para a identidade brasileira"}}},
{id:43,titulo:"Perspectivas para a democratização do acesso à alimentação saudável",eixo:1,prob:"MEDIA",fontes:["Abimael Ferreira","Aprova Total"],evidencias:"Taxa de obesidade no Brasil cresce; ultra-processados têm preço menor que alimentos in natura; desertos alimentares em periferias; tributação de ultra-processados aprovada em 2024.",esquema:{rep_intro:[{...REP.lula_fome,dica:"O compromisso de tirar o Brasil do Mapa da Fome inclui não só acabar com a fome, mas garantir alimentação de qualidade; use para mostrar que o problema vai além da mera saciedade."},{...REP.ibge_desigualdade,dica:"Dados do IBGE sobre obesidade e acesso à alimentação saudável por classe social e região revelam o caráter estrutural da desigualdade alimentar."}],arg1:"O 'deserto alimentar' é uma realidade nas periferias urbanas: não há feiras, mercados com verduras frescas ou restaurantes com comida natural a preço acessível, enquanto redes de fast food e mercadinhos com ultra-processados proliferam, tornando a escolha saudável um privilégio.",rep1:[{texto:"Carolina Maria de Jesus — Quarto de Despejo (1960)",tipo:"Cultural/Literatura",dica:"Em Quarto de Despejo, Carolina registra o que é catar restos de comida para sustentar os filhos; seu diário torna impossível tratar o acesso à alimentação saudável como questão de escolha — e não de direito negado pelo Estado."},{...REP.fanon_condenados,dica:"Fanon mostra a contradição entre produção de alimentos para exportação e fome local; o agro-exportador brasileiro repete esse padrão."}],arg2:"A indústria alimentar tem interesse em manter os ultra-processados como opção mais acessível: marketing agressivo e design de produto pensado para criar dependência tornam a escolha saudável um desafio mesmo para quem quer fazê-la.",rep2:[{texto:"ANVISA — RDC 163/2014 e relatório sobre publicidade de alimentos para crianças",tipo:"Jurídico/Normativo",dica:"Chomsky analisa como a mídia e a publicidade constroem preferências; aplique ao marketing de alimentos ultra-processados que cria hábitos ruins desde a infância."},{...REP.sus_saude_mental,dica:"O SUS trata as doenças geradas pela má alimentação; investir em alimentação saudável é também economizar recursos do sistema de saúde."}],intervencao:{agente:"O governo federal",detalhamento:"poder executivo com capacidade de intervenção na política tributária e alimentar",acao:"deve ampliar a tributação de ultra-processados e usar a receita para subsidiar alimentos in natura nas periferias e ampliar o PNAE",modo:"por meio de programa de fomento a feiras agroecológicas em bairros periféricos, iotação seletíva e ampliação do PNAE",efeito:"reduzindo a desigualdade no acesso à alimentação saudável e contribuindo para o combate à epidemia de obesidade"}}},
{id:44,titulo:"Os impactos da tecnologia e da cultura digital na vida dos jovens brasileiros",eixo:5,prob:"MEDIA",fontes:["Elias Ancelmo","Bella Nazar"],evidencias:"Jovens passam mais de 9 horas por dia conectados; influência da cultura digital nas identidades e valores; debate sobre habilidades cognitivas e atenção; oportunidades de empreendedorismo digital.",esquema:{rep_intro:[{texto:"Racionais MC's — Sobrevivendo no Inferno (1997)",tipo:"Cultural/Música",dica:"Os Racionais MC's produziram em 1997 uma das maiores obras da cultura jovem brasileira sem apoio institucional; o álbum evidencia que tecnologia e cultura digital são experiências profundamente desiguais para os jovens brasileiros."},{texto:"OMS — \"Mental Health Action Plan 2013–2030\": impacto das tecnologias na saúde mental",tipo:"Dado/Pesquisa",dica:"Harari analisa como a tecnologia transforma a própria natureza humana; use para dimensionar a profundidade das mudanças que a cultura digital produz nos jovens."}],arg1:"A cultura digital transforma as formas de aprender, relacionar e criar: jovens que crescem conectados desenvolvem habilidades multi-tarefa e de navegação de informação, mas podem ter dificuldade com atenção sustentada e pensamento profundo.",rep1:[{...REP.byung_chul,dica:"Han critica a hiperestimulação que impede o aborrecimento criativo: é no silêncio e no vazio que surgem as grandes ideias; a cultura digital não permite esse espaço."},{texto:"Fiocruz — \"Saúde Mental dos Adolescentes Brasileiros\" (2023): uso problemático de redes",tipo:"Dado/Pesquisa",dica:"Bauman mostra que identidades se tornaram instáveis; nos jovens conectados, a necessidade constante de validação digital gera esgotamento identitário."}],arg2:"A cultura digital também abre janelas de oportunidade: jovens brasileiros acessam informação, mercados globais e ferramentas criativas que antes eram restritas a elites; o desafio é garantir que esse acesso seja universal e crítico.",rep2:[{...REP.ibge_desigualdade,dica:"Dados sobre acesso à internet por faixa de renda e região; a desigualdade digital reproduz e amplifica a desigualdade social."}],intervencao:{agente:"O sistema de educação básica",detalhamento:"conjunto de instituições responsáveis pela formação integral dos jovens brasileiros",acao:"deve integrar a educação mídia e digital ao currículo de forma transversal e crítica",modo:"formando jovens capazes de usar a tecnologia criticamente, distinguir informação de desinformação e criar com responsabilidade",efeito:"preparando a geração digital para ser protagonista e não vítima da cultura digital"}}},
{id:45,titulo:"Perspectivas para a regulação da inteligência artificial na comunicação brasileira",eixo:4,prob:"MEDIA",fontes:["Elias Ancelmo","Abimael Ferreira"],evidencias:"PL de regulação da IA tramita no Congresso; deepfakes usados em campanhas eleitorais; algoritmos de recomendação polarizam o debate público; UE aprova AI Act como referência internacional.",esquema:{rep_intro:[{texto:"Parlamento Europeu — AI Act (2024): regulação de IA e proteção de direitos fundamentais",tipo:"Jurídico/Normativo",dica:"Harari discute como a IA pode superar a inteligência humana e criar novas formas de poder; use para mostrar a urgência de regular essa tecnologia antes que ela regule a nós."},{...REP.lgpd,dica:"A LGPD mostrou que o Brasil pode criar regulação digital eficaz; use como modelo para defender um marco de IA igualmente sólido."}],arg1:"A IA na comunicação apresenta riscos específicos à democracia: deepfakes que simulam políticos dizendo o que não disseram, algoritmos que amplificam conteúdo radicalizado e bots que simulam opinião pública criam uma realidade alternativa que mina a confiança institucional.",rep1:[{texto:"Stanford Internet Observatory — Relatório sobre Desinformação Gerada por IA (2024)",tipo:"Dado/Pesquisa",dica:"Chomsky analisou a manufatura do consentimento por mídia tradicional; a IA permite uma fabricação ainda mais eficiente e personalizada do consentimento."},{texto:"Instituto Reuters/Oxford — Relatório de Notícias Digitais 2024: Brasil lidera desinformação",tipo:"Dado/Pesquisa",dica:"A incerteza líquida de Bauman é agravada pela desinformação: quando não se sabe o que é real, a ansiedade e o apego a certezas extremas crescem."}],arg2:"A regulação precisa equilibrar inovação e proteção: um marco regulatório muito restritivo pode frear o desenvolvimento tecnológico brasileiro; por outro lado, a ausência de regras deixa a população desprotegida.",rep2:[{texto:"Parlamento Europeu — AI Act (2024): regulação de IA como proteção contra poderes emergentes",tipo:"Jurídico/Normativo",dica:"Tocqueville mostrou que democracia exige proteção contra os novos poderes; a IA desregulada é um desses poderes que ameaça o equilíbrio democrático."}],intervencao:{agente:"O Congresso Nacional",detalhamento:"poder legislativo com competência para criar marcos regulatórios nacionais",acao:"deve aprovar o PL de regulação da IA com foco em transparência algorítmica, responsabilização por danos e proteção da integridade das informações",modo:"inspirado no AI Act europeu e adaptado à realidade brasileira, com participação da sociedade civil no processo",efeito:"protegendo a democracia e a veracidade da informação sem inibir a inovação tecnológica"}}},
{id:46,titulo:"Desafios para a promoção da saúde da mulher no Brasil",eixo:7,prob:"BAIXA_MEDIA",fontes:["Aprova Total","SAE Simulados"],evidencias:"Mortalidade materna entre as mais altas da América Latina; racismo institucional no atendimento à mulher negra; câncer de mama e cervical com diagnóstico tardio; violência obstétrica ainda documentada.",esquema:{rep_intro:[{...REP.sus_saude_mental,dica:"O SUS é o principal sistema de saúde da mulher brasileira; use para mostrar que fortalecer o SUS é uma política de saúde da mulher."},{...REP.mbembe_necro,dica:"Mbembe e a necropolítica: quem tem direito de sobreviver ao parto? Os dados de mortalidade materna negra respondem de forma brutal."}],arg1:"A mortalidade materna no Brasil é extremamente desigual: mulheres negras morrem de causas obstétricas em taxa até três vezes maior que mulheres brancas, revelando como o racismo estrutural opera dentro dos serviços de saúde.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre mortalidade materna por raça e região no Brasil."},{...REP.fanon_condenados,dica:"Fanon mostra que o colonialismo opera também nos corpos; a desigualdade racial na saúde materna é produto de um sistema que historicamente desvalorizou corpos negros."}],arg2:"A violência obstétrica — humilhações, procedimentos não consentidos, negativa de atenção — ainda é normalizada em muitos serviços: a ausência de legislação específica e a falta de notificação perpetuam a impunidade.",rep2:[{...REP.feminicidio_lei,dica:"A Lei do Feminicídio protege mulheres da violência letal; use como paralelo para defender legislação que proteja as mulheres também nos serviços de saúde."},{...REP.onu_saude_mental,dica:"A OMS reconhece a saúde reprodutiva como dire ito fundamental; use para dar dimensão internacional ao problema."}],intervencao:{agente:"O Ministério da Saúde",detalhamento:"órgão responsável pela política nacional de saúde da mulher",acao:"deve implementar protocolos obrigatórios de humanização do parto, criar mecanismos de denúncia de violência obstétrica e ampliar o rastreamento de câncer feminino pelo SUS",modo:"com formação continuada dos profissionais de saúde em equidade racial e campanhas de informação às mulheres sobre seus direitos",efeito:"reduzindo a mortalidade materna e garantindo que o parto e o cuidado com a saúde feminina sejam experiências seguras e respeitosas para todas as mulheres"}}},
{id:47,titulo:"Caminhos para garantir a igualdade salarial entre homens e mulheres no Brasil",eixo:8,prob:"BAIXA_MEDIA",fontes:["Aprova Total","SAE Simulados"],evidencias:"Lei da Igualdade Salarial (14.611/2023) aprovada; mulheres ganham em média 22% menos que homens em funções iguais; intersecção de gênero e raça aprofunda a desigualdade; Relatório do Fórum Econômico Mundial aponta o Brasil entre os piores em equidade salarial.",esquema:{rep_intro:[{...REP.lei_igualdade_salarial,dica:"A Lei 14.611/2023 é um marco legal; use para mostrar que o Estado reconhece o problema, mas a lei por si só não basta sem fiscalização e cultura de equidade."},{...REP.ibge_desigualdade,dica:"Dados sobre a distribuição do trabalho doméstico e seu impacto na carreira das mulheres; mostram que a desigualdade tem raízes que vão além do salário."}],arg1:"A desigualdade salarial entre gêneros tem raízes estruturais que vão além da discriminação direta: o trabalho doméstico não remunerado recai majoritariamente sobre as mulheres, limitando suas horas disponíveis para produção e ascensão profissional.",rep1:[{texto:"OIT — Relatório \"Igualdade no Trabalho\" (2023): brecha salarial por gênero e raça no Brasil",tipo:"Dado/Pesquisa",dica:"Piketty mostra que desigualdades econômicas se auto-perpetuam; a desigualdade salarial de gênero é um exemplo de como o mercado, sem intervenção, reproduz injustiças."},{...REP.fanon_condenados,dica:"Fanon mostra como o colonialismo reservou às mulheres o trabalho doméstico não remunerado como forma de controle; essa herança persiste no Brasil contemporâneo."}],arg2:"A discriminação indireta é mais difícil de combater que a direta: em vez de pagar menos pelo mesmo trabalho, empresas reservam os cargos mais bem remunerados para homens, usando critérios aparentemente neutros que mascaram a preferência de gênero.",rep2:[{texto:"OIT — \"Igualdade no Trabalho\" (2023): brecha salarial e naturalização da desigualdade de gênero",tipo:"Dado/Pesquisa",dica:"Chomsky analisa como ideologias dominantes são naturalizadas; a ideia de que mulheres 'escolhem' cargos inferiores é uma naturalização da discriminação de gênero."}],intervencao:{agente:"O Ministério do Trabalho e Emprego",detalhamento:"detentor da competência exclusiva de legislar sobre direito do trabalho e de criar mecanismos coercitivos que obriguem as empresas a cumprir a Lei da Igualdade Salarial",acao:"deve fiscalizar o cumprimento da Lei 14.611/2023, publicar rankde de empresas por equidade salarial e criar incentivos fiscais para empresas que comprovem igualdade",modo:"por meio de auditorias salariais obrigatórias, transparência nos relatórios e programa de mentoria para promoção de mulheres",efeito:"reduzindo a brecha salarial e garantindo que mulheres tenham as mesmas oportunidades de ascensão profissional que os homens"}}},
{id:48,titulo:"Os desafios da exclusão digital nas relações sociais entre gerações",eixo:5,prob:"BAIXA_MEDIA",fontes:["Elias Ancelmo","Bella Nazar"],evidencias:"Idosos são os mais afetados pela exclusão digital; golpes financeiros por WhatsApp afetam principalmente pessoas com mais de 60 anos; pandemia acelerou a digitalização de serviços essenciais sem preparo das gerações mais velhas.",esquema:{rep_intro:[{texto:"IBGE — PNAD Contínua 2023: letramento digital por faixa etária",tipo:"Dado/Pesquisa",dica:"Bauman discute como a modernidade líquida separa as gerações: cada uma tem uma relação diferente com o tempo, a tecnologia e os vínculo; a exclusão digital aprofunda esse afastamento."},{...REP.ibge_desigualdade,dica:"Dados sobre acesso à internet por faixa etária no Brasil: os idosos são os mais excluídos digitalmente."}],arg1:"A digitalização compulsória de serviços essenciais — bancos, governo, saúde — excluiu os idosos sem oferecer alternativas: quem não usa smartphone passou a ter acesso mais difícil a serviços básicos de cidadania.",rep1:[{...REP.freire_pedagogia,dica:"Freire defende a educação que parte da realidade do educando; programas de inclusão digital para idosos devem respeitar seu ritmo e contexto, não impor o modelo jovem."},{texto:"CGI.br — TIC Educação 2023: professores sem formação adequada para tecnologias educacionais",tipo:"Dado/Pesquisa",dica:"Harari mostra que a tecnologia avança mais rápido que a capacidade humana de adaptá-la; idosos ficam para trás nessa corrida sem apoio do Estado."}],arg2:"A exclusão digital entre gerações também fragmenta os vínculos familiares: quando a comunicação migra para plataformas que os mais velhos não dominam, os laços intergeracionais se enfraquecem e a solidão dos idosos aumenta.",rep2:[{...REP.byung_chul,dica:"Byung-Chul Han discute o isolamento na sociedade digital; os idosos, excluídos do ambiente digital, enfrentam forma dupla de exclusão: digital e social."}],intervencao:{agente:"O governo federal em parceria com os serviços públicos digitalizados",detalhamento:"poder público responsável pela garantia de acesso universal a serviços essenciais",acao:"deve manter alternativas presenciais e telefônicas para todos os serviços digitalizados e criar programa de inclusão digital para idosos",modo:"por meio de centros de referência de inclusão digital, parceria com escolas para atendimento intergeracional e aplicações simplificadas para pessoas maiores de 60 anos",efeito:"garantindo que a digitalização não se torne nova forma de exclusão para as gerações mais velhas"}}},
{id:49,titulo:"Desafios para a democratização do acesso à cultura no Brasil",eixo:3,prob:"BAIXA_MEDIA",fontes:["Abimael Ferreira","Aprova Total"],evidencias:"Museus, teatros e cinemas concentrados nas capitais; preços de ingressos inacessíveis para a maioria; Lei Rouanet beneficia principalmente grandes produções urbanas; pandemia mostrou que a cultura digital pode democratizar o acesso.",esquema:{rep_intro:[{texto:"MinC — Relatório \"Cultura Digital e Acesso\" (2023): plataformas e ampliação do acesso à arte",tipo:"Dado/Pesquisa",dica:"Benjamin analisa como a reprodução técnica pode democratizar a arte; use para mostrar que a digitalização da cultura é oportunidade para ampliar o acesso."},{...REP.ibge_desigualdade,dica:"Dados sobre acesso à cultura por região e renda no Brasil mostram a concentração e a exclusão cultural das regiões menos desenvolvidas."}],arg1:"A concentração geográfica e econômica da oferta cultural reproduz a desigualdade: quem mora no interior ou em periferias urbanas tem acesso muito mais restrito a museus, teatros e cinemas, limitando sua formação estética e seu senso crítico.",rep1:[{texto:"IBGE/PNAD Contínua 2023 — desigualdade de acesso à educação por renda e cor/raça",tipo:"Dado/Pesquisa",dica:"Piketty mostra que desigualdade cultural é parte da desigualdade econômica: quem tem mais capital também acumula mais capital cultural."},{...REP.fanon_condenados,dica:"Fanon mostra como o colonialismo hierarquiza culturas; o Sudeste como 'centro cultural' do Brasil repete esse padrão, subvalorizando as culturas periféricas."}],arg2:"A Lei Rouanet, principal mecanismo de financiamento cultural, tem falhas estruturais: permite que empresas usem imposto devido para financiar projetos de seu interesse, não necessariamente os mais necessários para democratizar o acesso.",rep2:[{texto:"Kleber Mendonça Filho — Bacurau (2019)",tipo:"Cultural/Cinema",dica:"Bacurau (2019), premiado em Cannes, retrata uma comunidade nordestina resistindo ao apagamento; o filme mostra que a cultura periférica tem valor universal quando recebe apoio — e que o Estado deve garantir esse espaço."}],intervencao:{agente:"O Ministério da Cultura",detalhamento:"órgão responsável pelas políticas culturais nacionais",acao:"deve reformular a Lei Rouanet priorizando projetos em regiões e comunidades com menor acesso à cultura e criar plataforma digital gratuita de conteúdo cultural brasileiro",modo:"com critérios de distribuição geográfica e social dos recursos públicos utilizados e parcerias com plataformas digitais",efeito:"garantindo que o financiamento público da cultura beneficie prioritariamente quem menos acessa e que a diversidade cultural brasileira tenha visibilidade"}}},
{id:50,titulo:"Medidas para a redução das desigualdades no acesso ao ensino superior",eixo:2,prob:"BAIXA_MEDIA",fontes:["Aprova Total","Abimael Ferreira"],evidencias:"Cotas raciais no STF julgadas constitucionals; PROUNI e FIES como políticas de acesso; mas evasão no ensino superior ainda alta entre estudantes de baixa renda; custo de vida nos grandes centros universitários é barreira para permanência.",esquema:{rep_intro:[{...REP.freire_pedagogia,dica:"Freire vê a educação como instrumento de transformação social; a democratização do ensino superior é condição para a construção de uma sociedade mais justa."},{...REP.ibge_desigualdade,dica:"Dados sobre taxa de evasão no ensino superior por faixa de renda e raça mostram que o problema de acesso é também de permanência."}],arg1:"O acesso ao ensino superior cresceu com cotas e PROUNI, mas a permanência ainda é o gargalo: estudantes que vêm de famílias pobres precisam trabalhar para se sustentar, reduzindo o tempo para estudar e aumentando a chance de evadir.",rep1:[{texto:"IBGE/PNAD Contínua 2023 — desigualdade de acesso à educação por renda e cor/raça",tipo:"Dado/Pesquisa",dica:"Piketty: sem intervenção, o mercado educacional privilegia quem já tem mais; cotas são necessárias mas insuficientes sem suporte financeiro à permanência."},{...REP.pe_de_meia,dica:"O Pê-de-Meia mostra que estímulos financeiros aumentam a permanência escolar; aplique ao ensino superior para defender bolsas de permanência abrangentes."}],arg2:"A expansão das universidades públicas para o interior foi importante, mas ainda insuficiente: áreas de conhecimento estratégicas como medicina, direito e engenharia seguem concentradas nas capitais e em universidades privadas caras.",rep2:[{...REP.pne_2026,dica:"O PNE 2026 inclui metas de democratização do ensino superior; use para mostrar que há compromisso formal, mas a concretização depende de financiamento e vontade política."}],intervencao:{agente:"O governo federal",detalhamento:"poder executivo com controle sobre políticas de educação superior",acao:"deve ampliar o programa de auxílio estudantil para cobrir moradia, alimentação e transporte de estudantes de baixa renda nas universidades públicas",modo:"com critérios socioeconômicos claros, gestão participativa pelas universidades e monitoramento de indica dores de permanência",efeito:"garantindo não apenas o acesso, mas a permanência e a conclusão do curso superior pelos mais vulneráveis"}}},
{id:51,titulo:"Perspectivas para o acesso à cultura digital no Brasil",eixo:3,prob:"BAIXA_MEDIA",fontes:["Abimael Ferreira","SAE Simulados"],evidencias:"Pandemia mostrou que cultura digital pode democratizar o acesso; mas 1 em 3 brasileiros ainda não tem internet de qualidade; plataformas de streaming são pagas; conteúdo cultural nacional sub-representado.",esquema:{rep_intro:[{texto:"Pesquisa de Consumo de Conteúdo Digital (Kantar Ibope, 2023): criadores independentes no Brasil",tipo:"Dado/Pesquisa",dica:"Toffler previu a era da produção cultural descentralizada; use para mostrar que a tecnologia pode ser aliada da democratização cultural."},{texto:"Conceição Evaristo — Escrevivências (obra desde 1990)",tipo:"Cultural/Literatura",dica:"Conceição Evaristo cunhou o conceito de escrevivência — a escrita que nasce da experiência vivida — para reivindicar a literatura negra como patrimônio legítimo; sua obra é referência sobre resistência cultural e acesso à produção artística."}],arg1:"A pandemia demonstrou que o digital pode ser vetor de democratização cultural: museus virtuais, shows online e plataformas abertas permitiram que pessoas de todo o país acessassem conteúdo cultural sem sair de casa.",rep1:[{...REP.freire_pedagogia,dica:"Freire defende o acesso universal ao conhecimento; a cultura digital gratuita é uma forma de concretizar esse princípio na era da informação."}],arg2:"O digital, no entanto, não elimina a desigualdade de acesso: quem não tem internet de qualidade ou dispositivos modernos não acessa nem a cultura digital, revelando que a infraestrutura digital é pré-requisito para a cidadania cultural.",rep2:[{...REP.ibge_desigualdade,dica:"Dados sobre acesso à internet e participação em atividades culturais por classe social."},{texto:"OXFAM Brasil — Relatório \"A Distância que nos Une\" (2023): concentração de renda e riqueza no Brasil",tipo:"Dado/Pesquisa",dica:"Piketty mostra que desigualdades não se corrigem sozinhas; sem investimento público em infraestrutura digital, a cultura digital será mais um privilégio dos que já têm mais."}],intervencao:{agente:"O governo federal",detalhamento:"poder público com capacidade de universalizar o acesso à infraestrutura digital",acao:"deve implementar plano de universalização de internet banda larga de alta qualidade nas regiões mais pobres e criar plataforma pública gratuita de conteúdo cultural brasileiro",modo:"por meio de parcerias com operadoras e com obrigações de cobertura em contratos de concessão",efeito:"tornando a cultura digital acessível a todos os brasileiros e ampliando a participação cultural"}}},
{id:52,titulo:"Caminhos para a prevenção dos transtornos alimentares no Brasil",eixo:7,prob:"BAIXA_MEDIA",fontes:["Aprova Total","SAE Simulados"],evidencias:"Anorexia e bulimia afetam especialmente adolescentes; redes sociais propagam padrões corporais inatingíveis; Brasil tem alta prevalência de transtornos alimentares entre jovens; míias social associada a imagem corporal negativa.",esquema:{rep_intro:[{...REP.byung_chul,dica:"Han analisa a sociedade do desempenho que exige corpos perfeitos; os transtornos alimentares são a expressão patológica dessa exigência."},{...REP.onu_saude_mental,dica:"Dados da OMS sobre transtornos alimentares e saúde mental de adolescentes; dão base científica internacional ao argumento."}],arg1:"Os transtornos alimentares têm raiz social, não apenas psicológica: a cultura da magreza propagada pelas redes sociais, agravada por algoritmos que amplificam conteúdo de dieta e beleza, cria ambiente tóxico que precipita esses transtornos.",rep1:[{texto:"FGV Social — Tendências do Mercado de Trabalho Futuro (2024): requalificação profissional",tipo:"Dado/Pesquisa",dica:"Bauman: a modernidade líquida exige que recriemos nossa identidade continuamente; o corpo se torna projeto e os transtornos alimentares são o preço de uma identidade corporal que nunca satisfaz."},{texto:"Pesquisa FGV — \"Saúde Mental e Redes Sociais\" (2023): padrões de beleza e autoestima",tipo:"Dado/Pesquisa",dica:"Chomsky analisa como a mídia constrói padrões e deseja; as plataformas digitais atuam como nova mídia que imposta padrões de beleza inatingíveis."}],arg2:"A prevenção exige intervenção sobre o ambiente e não apenas sobre o indivíduo: enquanto plataformas digitais puderem promover conteúdo que glorifica a magreza extrema sem qualquer responsabilização, o número de casos continuará crescendo.",rep2:[{...REP.lei_celular,dica:"A restrição do celular nas escolas já reconhece o impacto das redes na saúde mental; expanda para defender regulação de conteúdo prejudicial a adolescentes."},{...REP.sus_saude_mental,dica:"O SUS tem obrigação de tratar transtornos alimentares; o aumento de casos exige investimento em serviços especializados acessíveis."}],intervencao:{agente:"O Conselho Federal de Medicina e as plataformas digitais",detalhamento:"órgão médico e empresas que controlam o conteúdo consumido por adolescentes",acao:"devem estabelecer protocolos de identificação e remoção de conteúdo que promove transtornos alimentares e criar mecanismo de denúncia ágil",modo:"com integração com serviços de saúde mental e campanhas de educação sobre imagem corporal nas escolas",efeito:"criando ambiente digital mais seguro para adolescentes e reduzindo a incidência de transtornos alimentares"}}},
{id:53,titulo:"Medidas para a redução das desigualdades entre trabalho formal e informal",eixo:8,prob:"BAIXA_MEDIA",fontes:["SAE Simulados","Aprova Total"],evidencias:"Trabalhadores informais não acessam FGTS, seguro-desemprego e previdência; reforma trabalhista de 2017 criou formas híbridas de trabalho; gig economy expande o universo dos sem direitos.",esquema:{rep_intro:[{texto:"IBGE — PNAD Contínua 2024: 38 milhões de trabalhadores informais e ausência de proteção social",tipo:"Dado/Pesquisa",dica:"Piketty demonstra como desigualdades se auto-perpetuam; o trabalhador informal sem FGTS nem previdência não acumula capital, perpetuando a pobreza intergeracional."},{...REP.ibge_desigualdade,dica:"Dados sobre taxa de informalidade e seus impactos na renda e na proteção social mostram o tamanho do problema."}],arg1:"A dualidade formal/informal cria cidadania de segunda classe: trabalhadores informais pagam impostos indiretos como consumidores, mas não recebem as contrapartidas de um sistema de proteção social para o qual também contribuem indiretamente.",rep1:[{...REP.fanon_condenados,dica:"Fanon mostra que os condenados da terra são os que ficam fora dos mecanismos formais de proteção; no Brasil, os trabalhadores informais são os mais expostos e os menos protegidos."},{...REP.mbembe_necro,dica:"A informalidade mata: trabalhadores sem INSS não se aposentam com dignidade e ficam expostos à pobreza na terceira idade."}],arg2:"A gig economy aprofunda o problema ao criar uma zona cinzenta: entregadores e motoristas de aplicativo trabalham em regime de dependência econômica das plataformas, mas são classificados como 'parceiros', excluindo-os de todos os direitos trabalhistas.",rep2:[{texto:"DIEESE — Nota Técnica \"Trabalho por Plataformas Digitais\" (2023)",tipo:"Dado/Pesquisa",dica:"Toffler previu a fragmentação do trabalho na era digital; a informalidade é um produto estrutural dessa fragmentação, exigindo novas formas de proteção social."},{...REP.senai_trabalho,dica:"A qualificação profissional é uma das saídas da armadilha informal; o SENAI pode ser caminho para a transição ao mercado formal."}],intervencao:{agente:"O governo federal",detalhamento:"poder executivo com competência sobre política trabalhista e previdenciária",acao:"deve criar regime previdenciário acessível a trabalhadores informais com contribuições proporcionais à renda e regulamentar o trabalho em plataformas digitais",modo:"por meio de aplicativo digital integrado ao e-Social, negociação com plataformas e simplificação da formalização para autônomos",efeito:"garantindo cobertura previdenciária para todos os trabalhadores, independentemente da natureza do vínculo"}}},
{id:54,titulo:"Perspectivas para o letramento digital na educação básica brasileira",eixo:5,prob:"BAIXA_MEDIA",fontes:["Bella Nazar","Aprova Total"],evidencias:"PISA aponta baixo desempenho de estudantes brasileiros em habilidades digitais; BNCC prevê competência digital mas falta infraestrutura; professores sem formação adequada; acesso desigual a computadores e internet nas escolas públicas.",esquema:{rep_intro:[{...REP.freire_pedagogia,dica:"Freire defende a leitura crítica do mundo; o letramento digital é a atualização dessa proposta para a era da informação."},{texto:"TSE — Resolução 23.714/2022 e Relatório de Combate à Desinformação Eleitoral (2022)",tipo:"Jurídico/Normativo",dica:"Chomsky analisou a manipulação por mídia tradicional; o letramento digital é a defesa contra a nova forma de manipulação midiática das redes sociais e algoritmos."}],arg1:"O letramento digital não se resume a saber usar o celular: envolve verificar informações, proteger dados pessoais, navegar com segurança e produzir conteúdo de forma responsável. Sem essa formação, os estudantes ficam expostos a golpes, desinformação e manipulação.",rep1:[{texto:"OCDE — \"Skills Outlook 2023\": adaptabilidade e pensamento crítico como competências-chave",tipo:"Dado/Pesquisa",dica:"Harari previu que as principais habilidades do século XXI serão adaptabilidade e pensamento crítico; o letramento digital é a forma concreta de desenvolver essas habilidades."},{texto:"CGI.br — TIC Domicílios 2023: 26% dos brasileiros sem acesso à internet",tipo:"Dado/Pesquisa",dica:"Toffler previu que as habilidades digitais seriam o novo divisor de águas social; use para mostrar a urgência de democratizar o letramento digital."}],arg2:"A desigualdade no letramento digital tem impacto direto no mercado de trabalho: jovens de escolas privadas dominam ferramentas digitais enquanto estudantes de escolas públicas chegam ao mercado de trabalho em desvantagem significativa.",rep2:[{...REP.ibge_desigualdade,dica:"Dados sobre acesso a computadores e internet nas escolas públicas versus privadas e o impacto no mercado de trabalho."},{...REP.pne_2026,dica:"O PNE 2026 inclui metas de letramento digital; use para mostrar o compromisso formal do Estado e cobrar sua concretização."}],intervencao:{agente:"O FNDE — Fundo Nacional de Desenvolvimento da Educação",detalhamento:"órgão federal responsável pelo financiamento da educação básica pública",acao:"deve financiar programa nacional de equipamento das escolas públicas com dispositivos e internet de qualidade, combinado com programa de formação de professores em letramento digital crítico",modo:"por meio de compras centralizadas de equipamentos, parceria com telecôos para internet e módulo obrigatório de letramento digital na formação docente",efeito:"reduzindo a desigualdade digital entre escolas públicas e privadas e preparando os estudantes para o mundo do trabalho e a cidadania digital"}}},
{id:55,titulo:"Caminhos para a inclusão social de pessoas com deficiências não aparentes",eixo:1,prob:"BAIXA_MEDIA",fontes:["Abimael Ferreira","SAE Simulados"],evidencias:"Pessoas com deficiência auditiva, fibromialgia, autismo de alto funcionamento, entre outras, enfrentam ceticismo social; LBI garante direitos, mas fiscalização é precária; debate sobre inclusão que respeita especificidades.",esquema:{rep_intro:[{...REP.brasil_200,dica:"A LBI inclui pessoas com deficiências não aparentes; use para mostrar que há arcabouço legal, mas a distância entre lei e realidade é enorme."},{...REP.freire_pedagogia,dica:"Freire questiona quem define 'normal'; use para problematizar a invisibilidade das deficiências não aparentes e o preconceito que ela gera."}],arg1:"A deficiência não aparente coloca a pessoa diante de uma dupla discriminação: ao reivindicar direitos, é contestada com frases como 'mas você parece normal', o que invalida sua experiência e a obriga a provar constantemente o que sente.",rep1:[{...REP.ibge_desigualdade,dica:"Dados sobre o percentual de brasileiros com deficiência e a distribuição das deficiências mostram que as não aparentes são numericamente expressivas."},{...REP.mbembe_necro,dica:"O Estado que não reconhece a deficiência não aparente decide implicitamente que esses cidadãos não têm lugar pleno na vida social."}],arg2:"O mercado de trabalho, mesmo quando cumpre a lei de cotas para pessoas com deficiência, frequentemente faz isso de forma meramente formal, sem adaptações reais ao ambiente ou às demandas específicas de cada condição.",rep2:[{...REP.byung_chul,dica:"Han critica a sociedade do desempenho que descarta quem não produz no ritmo esperado; pessoas com deficiências não aparentes sofrem pressão para 'parecer normal' sem que se reconheçam suas limitações reais."}],intervencao:{agente:"O Ministério dos Direitos Humanos",detalhamento:"órgão responsável pela promoção dos direitos das pessoas com deficiência",acao:"deve lançar campanha nacional de conscientização sobre deficiências não aparentes e qualificar a fiscalização da LBI",modo:"com participação de pessoas com deficiência não aparente na elaboração e divulgação da campanha e formação de auditores do MTE",efeito:"reduzindo o estigma e garantindo que os direitos garantidos em lei sejam efetivamente cumpridos"}}},
